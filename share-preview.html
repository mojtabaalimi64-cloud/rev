<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سفر با رانش EV</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;font-family:Tahoma,sans-serif;display:flex;justify-content:center;overflow:hidden}
#s{width:100%;max-width:430px;height:100vh;max-height:900px;position:relative;overflow:hidden;background:#0f1f14;color:#fff}
#mapw{position:absolute;inset:0;z-index:1}
#smap{width:100%;height:100%;display:block}
#s::after{content:'';position:absolute;inset:0;pointer-events:none;z-index:3;background:linear-gradient(180deg,rgba(0,0,0,.55) 0%,transparent 20%,transparent 60%,rgba(0,0,0,.8) 100%)}
.hdr{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:12px 16px;z-index:10}
.logo{font-size:20px;font-weight:900;text-shadow:0 2px 8px rgba(0,0,0,.8)}
.logo b{color:#00e676}
.prof{display:flex;align-items:center;gap:8px;background:rgba(0,0,0,.5);padding:6px 12px 6px 6px;border-radius:30px}
.prof span{font-size:13px;font-weight:bold}
#route{position:absolute;top:62px;left:0;right:0;z-index:10;text-align:center}
#route .r{font-size:22px;font-weight:900;text-shadow:0 2px 10px rgba(0,0,0,.9)}
#route .m{font-size:13px;color:#e0e0e0;text-shadow:0 1px 4px rgba(0,0,0,.9)}
#stats{position:absolute;bottom:118px;left:10px;right:10px;z-index:10;display:flex;gap:8px;justify-content:center}
.stat{background:rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.18);border-radius:16px;padding:9px 14px;text-align:center;min-width:78px}
.stat .v{font-size:20px;font-weight:900}
.stat .v small{font-size:11px;color:#aaa}
.stat .l{font-size:11px;color:#aaa}
#elevw{position:absolute;bottom:0;left:0;right:0;z-index:10;background:linear-gradient(0deg,rgba(0,0,0,.85),transparent);padding:6px 14px 10px;text-align:center}
#elev{width:100%;height:50px;display:block}
#einfo{font-size:12px;color:#ccc;margin-top:2px}
#btns{position:absolute;bottom:168px;right:10px;z-index:11;display:flex;flex-direction:column;gap:8px}
#btns button{width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,255,255,.25);background:rgba(0,0,0,.6);color:#fff;font-size:20px;cursor:pointer}
#ld{position:absolute;inset:0;background:#0f1f14;z-index:50;display:flex;align-items:center;justify-content:center}
#marker{position:absolute;width:52px;height:52px;transform:translate(-50%,-50%);z-index:5;pointer-events:none}
</style>
</head>
<body>
<div id="s">
<div id="ld"><div>در حال بارگذاری...</div></div>
<div id="mapw"><svg id="smap" viewBox="0 0 600 800" preserveAspectRatio="xMidYMid slice"></svg><div id="marker"><div style="width:56px;height:56px;filter:drop-shadow(0 4px 12px rgba(0,0,0,.5))">
<svg width="56" height="56" viewBox="0 0 56 56">
<circle cx="28" cy="28" r="26" fill="rgba(0,0,0,.6)" stroke="#00e676" stroke-width="3"/>
<path d="M20 38 L24 22 Q25 18 29 18 L33 18 Q37 18 38 22 L42 38" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
<rect x="26" y="10" width="8" height="10" rx="2" fill="#00e676"/>
<path d="M28 38 L28 46 M24 42 L32 42" stroke="#ffd54f" stroke-width="3" stroke-linecap="round"/>
</svg></div></div></div>
<div class="hdr"><div class="logo">⚡ رانش <b>EV</b></div><div class="prof"><span id="pn">—</span></div></div>
<div id="route"><div class="r"><span id="ro">—</span> ← <span id="rd">—</span></div><div class="m" id="rm">—</div></div>
<div id="stats">
<div class="stat"><div class="v" id="st1">—</div><div class="l">مسافت</div></div>
<div class="stat"><div class="v" id="st2">—</div><div class="l">شارژ</div></div>
<div class="stat"><div class="v" id="st3">—</div><div class="l">ارتفاع</div></div>
</div>
<div id="btns"><button id="bshare">📤</button><button id="bplay">⏸</button></div>
<div id="elevw"><svg id="elev" viewBox="0 0 600 50"></svg><div id="einfo">—</div></div>
</div>
<script>
var plan=null;
try{var hh=location.hash.slice(1);
if(hh){var dd=JSON.parse(decodeURIComponent(escape(atob(hh))));
plan={params:{origin:dd.o,destination:dd.d,battery:dd.b,soc:dd.s,consumption:dd.c},routeKm:dd.k,coords:dd.c.map(function(p){return [p[0]/1e5,p[1]/1e5];})};
if(dd.n)document.getElementById('pn').textContent=dd.n;}}catch(e){}
if(!plan){var qq=new URLSearchParams(location.search),pid=qq.get('plan');
try{var pps=JSON.parse(localStorage.getItem('rev_saved_trip_plans_v1')||'[]');
for(var ii=0;ii<pps.length;ii++)if(!pid||pps[ii].id===pid){plan=pps[ii];break;}}catch(e){}}
if(plan&&plan.coords&&plan.coords.length){
document.getElementById('ld').style.display='none';
var rt=plan.params||{},km=parseFloat(plan.routeKm||0)||0,coords=plan.coords;
document.getElementById('ro').textContent=rt.origin||'-';
document.getElementById('rd').textContent=rt.destination||'-';
document.getElementById('rm').textContent=Math.round(km*10)/10+' کیلومتر';
document.getElementById('einfo').textContent='طول مسیر: '+Math.round(km*10)/10+' کیلومتر';
// نقشه SVG بدون نیاز به اینترنت
var svg=document.getElementById('smap'),W=600,H=800;
var a=1e9,b=-1e9,c=1e9,d=-1e9;
coords.forEach(function(p){if(p[0]<a)a=p[0];if(p[0]>b)b=p[0];if(p[1]<c)c=p[1];if(p[1]>d)d=p[1];});
var pad=70;
function px(p){return [pad+(p[0]-a)/((b-a)||1)*(W-2*pad),H-pad-(p[1]-c)/((d-c)||1)*(H-2*pad)];}
var ns='http://www.w3.org/2000/svg';
// پس‌زمینه با گرادیان طبیعی
var bg=document.createElementNS(ns,'rect');
bg.setAttribute('width',W);bg.setAttribute('height',H);bg.setAttribute('fill','#1a2e1a');
svg.appendChild(bg);
// خطوط تراز تزئینی (حس توپوگرافی)
for(var ci=0;ci<8;ci++){
var el=document.createElementNS(ns,'ellipse');
el.setAttribute('cx',W/2+(ci%3-1)*120);el.setAttribute('cy',H/2+(ci%2)*150-75);
el.setAttribute('rx',180+ci*25);el.setAttribute('ry',130+ci*20);
el.setAttribute('fill','none');el.setAttribute('stroke','rgba(255,255,255,.06)');el.setAttribute('stroke-width','2');
svg.appendChild(el);
}
// مسیر باقی‌مانده (کم‌رنگ)
var full=document.createElementNS(ns,'path'),ds='M',stp=Math.max(1,Math.floor(coords.length/200));
for(var k=0;k<coords.length;k+=stp){var pp=px(coords[k]);ds+=(k?'L':'')+pp[0].toFixed(1)+','+pp[1].toFixed(1)+' ';}
full.setAttribute('d',ds);full.setAttribute('fill','none');
full.setAttribute('stroke','rgba(255,255,255,.3)');full.setAttribute('stroke-width','7');full.setAttribute('stroke-linecap','round');
svg.appendChild(full);
// مسیر طی‌شده
var done=document.createElementNS(ns,'path');
done.setAttribute('fill','none');done.setAttribute('stroke','#00e676');
done.setAttribute('stroke-width','7');done.setAttribute('stroke-linecap','round');
svg.appendChild(done);
// مبدأ و مقصد
var s0=px(coords[0]),s1=px(coords[coords.length-1]);
// مبدأ: دایره سبز
var cc0=document.createElementNS(ns,'circle');
cc0.setAttribute('cx',s0[0]);cc0.setAttribute('cy',s0[1]);cc0.setAttribute('r','14');
cc0.setAttribute('fill','#00e676');cc0.setAttribute('stroke','#fff');cc0.setAttribute('stroke-width','3');
svg.appendChild(cc0);
// مقصد: دوشاخه برق
var plug=document.createElementNS(ns,'text');
plug.setAttribute('x',s1[0]);plug.setAttribute('y',s1[1]+12);
plug.setAttribute('text-anchor','middle');plug.setAttribute('font-size','36');
plug.textContent='🔌';svg.appendChild(plug);
var marker=document.getElementById('marker');
var mapw=document.getElementById('mapw');
var st={i:0,play:true,bat:parseFloat(rt.battery||60),soc:parseFloat(rt.soc||90),con:parseFloat(rt.consumption||18)};
// دوربین: نقشه جابجا می‌شود تا نشانگر وسط باشد
function updateCam(xy){
var r=mapw.getBoundingClientRect();
var sx=r.width/W,sy=r.height/H;
// محاسبه آفست برای وسط نگه داشتن نشانگر
var ox=W/2-xy[0],oy=H/2-xy[1];
// محدود کردن
ox=Math.max(W-r.width/sx,Math.min(r.width/sx-W,ox));
svg.setAttribute('viewBox',(-ox)+' '+(-oy)+' '+W+' '+H);
marker.style.left=(W/2)+'px';
marker.style.top=(H/2)+'px';
}
function fa(n){try{return Number(n).toLocaleString('fa-IR');}catch(e){return n;}}
document.getElementById('bplay').onclick=function(){st.play=!st.play;this.textContent=st.play?'⏸':'▶';};
(function anim(){
if(st.play){st.i+=2;if(st.i>=coords.length-1)st.i=0;}
var ci=Math.round(st.i),xy=px(coords[ci]);
updateCam(xy);
var dd2='M',e2=Math.min(ci,coords.length-1);
for(var q=0;q<=e2;q+=stp){var qq=px(coords[q]);dd2+=(q?'L':'')+qq[0].toFixed(1)+','+qq[1].toFixed(1)+' ';}
done.setAttribute('d',dd2);
var dk=(st.i/(coords.length-1))*km;
var pct=Math.max(0,Math.round(st.soc-(dk*st.con/100)/st.bat*100));
document.getElementById('st1').textContent=fa(Math.round(dk*10)/10)+'km';
document.getElementById('st2').textContent=fa(pct)+'٪';
requestAnimationFrame(anim);
})();
document.getElementById('bshare').onclick=function(){
var dc={o:rt.origin,d:rt.destination,k:Math.round(km*10)/10,b:st.bat,s:st.soc,c:st.con,c:coords.filter(function(_,ix){return ix%Math.max(1,Math.floor(coords.length/120))===0;}).map(function(p){return [Math.round(p[0]*1e5),Math.round(p[1]*1e5)];}),n:document.getElementById('pn').textContent};
var url=location.origin+location.pathname+'#'+btoa(unescape(encodeURIComponent(JSON.stringify(dc))));
if(navigator.share){navigator.share({url:url}).catch(function(){});}
else{prompt('لینک:',url);}
};
}else{document.getElementById('ld').textContent='سفری یافت نشد';}
</script>
</body>
</html>
