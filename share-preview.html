<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سفر با رانش EV</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;font-family:Tahoma,sans-serif;display:flex;justify-content:center;overflow:hidden}
#s{width:100%;max-width:430px;height:100vh;max-height:900px;position:relative;overflow:hidden;background:#0b1622;color:#fff}
#map{position:absolute;inset:-15%;z-index:1;transition:transform .3s}
/* گرادیان‌ها */
#s::after{content:'';position:absolute;inset:0;pointer-events:none;z-index:3;
background:linear-gradient(180deg,rgba(0,0,0,.55) 0%,transparent 22%,transparent 62%,rgba(0,0,0,.75) 100%)}
.hdr{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:12px 16px;z-index:10}
.logo{font-size:20px;font-weight:900;text-shadow:0 2px 8px rgba(0,0,0,.7)}
.logo b{color:#00e676}
.prof{display:flex;align-items:center;gap:8px;background:rgba(0,0,0,.45);padding:6px 12px 6px 6px;border-radius:30px;backdrop-filter:blur(8px)}
.prof img{width:36px;height:36px;border-radius:50%;border:2px solid #00e676;object-fit:cover}
.prof span{font-size:13px;font-weight:bold}
#route{position:absolute;top:62px;left:0;right:0;z-index:10;text-align:center}
#route .r{font-size:22px;font-weight:900;text-shadow:0 2px 8px rgba(0,0,0,.8)}
#route .m{font-size:13px;color:#cfd8dc;text-shadow:0 1px 4px rgba(0,0,0,.8)}
/* قطب‌نما */
#compass{position:absolute;top:120px;left:14px;z-index:10;width:52px;height:52px;background:rgba(0,0,0,.5);border-radius:50%;backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;font-size:26px;border:1px solid rgba(255,255,255,.2);transition:transform .3s}
/* آمار */
#stats{position:absolute;bottom:118px;left:10px;right:10px;z-index:10;display:flex;gap:8px;justify-content:center}
.stat{background:rgba(0,0,0,.55);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.15);border-radius:16px;padding:9px 14px;text-align:center;min-width:76px}
.stat .v{font-size:20px;font-weight:900}
.stat .v small{font-size:11px;color:#90a4ae}
.stat .l{font-size:11px;color:#90a4ae}
/* ارتفاع */
#elevw{position:absolute;bottom:0;left:0;right:0;z-index:10;background:linear-gradient(0deg,rgba(0,0,0,.8),transparent);padding:6px 14px 10px}
#elev{width:100%;height:52px;display:block}
#btns{position:absolute;bottom:170px;right:10px;z-index:11;display:flex;flex-direction:column;gap:8px}
#btns button{width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,255,255,.25);background:rgba(0,0,0,.55);backdrop-filter:blur(8px);color:#fff;font-size:20px;cursor:pointer}
#ld{position:absolute;inset:0;background:#0b1622;z-index:50;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px}
.spin{width:46px;height:46px;border:4px solid rgba(0,230,118,.2);border-top-color:#00e676;border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.leaflet-control-attribution{font-size:9px!important;background:rgba(0,0,0,.4)!important;color:#999!important}
.leaflet-control-attribution a{color:#999!important}
</style>
</head>
<body>
<div id="s">
  <div id="ld"><div class="spin"></div><div>در حال بارگذاری...</div></div>
  <div id="map"></div>
  <div class="hdr"><div class="logo">⚡ رانش <b>EV</b></div><div class="prof"><span id="pn">—</span><img id="pi" style="display:none"></div></div>
  <div id="route"><div class="r"><span id="ro">—</span> ← <span id="rd">—</span></div><div class="m" id="rm">—</div></div>
  <div id="compass">🧭</div>
  <div id="stats">
    <div class="stat"><div class="v" id="st1">—</div><div class="l">مسافت</div></div>
    <div class="stat"><div class="v" id="st2">—</div><div class="l">شارژ</div></div>
    <div class="stat"><div class="v" id="st3">—</div><div class="l">ارتفاع</div></div>
  </div>
  <div id="btns"><button id="bshare">📤</button><button id="bplay">⏸</button></div>
  <div id="elevw"><svg id="elev" viewBox="0 0 600 52"></svg></div>
</div>
<script>
(function(){
  var plan=null;
  try{var h=location.hash.slice(1);
    if(h){var d=JSON.parse(decodeURIComponent(escape(atob(h))));
      plan={params:{origin:d.o,destination:d.d,battery:d.b,soc:d.s,consumption:d.c},routeKm:d.k,
      coords:d.c.map(function(p){return [p[0]/1e5,p[1]/1e5];}});if(d.n)document.getElementById('pn').textContent=d.n;}
  }catch(e){}
  if(!plan){var qs=new URLSearchParams(location.search),pid=qs.get('plan');
    try{var ps=JSON.parse(localStorage.getItem('rev_saved_trip_plans_v1')||'[]');
      for(var i=0;i<ps.length;i++)if(!pid||ps[i].id===pid){plan=ps[i];break;}}catch(e){}}
  if(!plan||!plan.coords||!plan.coords.length){
    var ldel=document.getElementById('ld'),ps2=[];
    try{ps2=JSON.parse(localStorage.getItem('rev_saved_trip_plans_v1')||'[]');}catch(e){}
    if(ps2.length){ldel.innerHTML='<div style="padding:20px;text-align:center"><h3>🗺️ انتخاب سفر</h3>'+ps2.map(function(p){var r=p.params||{};return '<div data-pid="'+p.id+'" class="pk" style="background:rgba(255,255,255,.1);border-radius:12px;padding:12px;margin:8px 0;cursor:pointer"><b>'+(r.origin||'-')+' ← '+(r.destination||'-')+'</b></div>';}).join('')+'</div>';
      ldel.querySelectorAll('.pk').forEach(function(x){x.onclick=function(){location.search='?plan='+x.getAttribute('data-pid');};});
    }else{ldel.innerHTML='<div style="text-align:center;padding:20px">سفر ذخیره‌شده‌ای نداری<br><button onclick="location.href=\'trip.html\'" style="margin-top:12px;background:#00e676;border:none;border-radius:20px;padding:10px 24px;font-weight:bold">برنامه‌ریزی سفر</button></div>';}
    return;}
  document.getElementById('ld').style.display='none';
  var rt=plan.params||{},km=parseFloat(plan.routeKm||0)||0,coords=plan.coords;
  document.getElementById('ro').textContent=rt.origin||'-';
  document.getElementById('rd').textContent=rt.destination||'-';
  document.getElementById('rm').textContent=Math.round(km*10)/10+' کیلومتر';
  try{var up=JSON.parse(localStorage.getItem('rev_user_profile')||'null');if(up&&up.name)document.getElementById('pn').textContent=up.name;}catch(e){}
  // نقشه واقعی با لایه توپوگرافی (نمایش پستی‌بلندی)
  var map=L.map('map',{zoomControl:false,attributionControl:true}).setView([coords[0][1],coords[0][0]],13);
  L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png',{maxZoom:17,attribution:'© OpenTopoMap'}).addTo(map);
  var latlngs=coords.map(function(c){return [c[1],c[0]];});
  // مسیر طی‌شده
  var doneLine=L.polyline([],{color:'#00e676',weight:7,opacity:.95}).addTo(map);
  // مسیر باقی‌مانده
  L.polyline(latlngs,{color:'#ffffff',weight:5,opacity:.4,dashArray:'1,8'}).addTo(map);
  // خودرو با چمدان
  var carHtml='<div style="width:56px;height:48px;filter:drop-shadow(0 4px 10px rgba(0,0,0,.5))"><svg width="56" height="48" viewBox="0 0 44 36"><rect x="10" y="2" width="24" height="8" rx="2" fill="#8B5E34" stroke="#5d3f22" stroke-width="1.5"/><rect x="14" y="0" width="16" height="4" rx="1" fill="#A0714A"/><path d="M6 30 L8 18 Q9 14 13 14 L17 14 L20 8 Q21 6 24 6 L28 6 Q31 6 32 8 L35 14 L39 14 Q43 14 43 18 L43 30 Z" fill="#00e676" stroke="#007a3d" stroke-width="1.5"/><rect x="20" y="10" width="12" height="6" rx="1" fill="#c8f5d8"/><circle cx="14" cy="30" r="5" fill="#222"/><circle cx="36" cy="30" r="5" fill="#222"/></svg></div>';
  var carIcon=L.divIcon({html:carHtml,className:'',iconSize:[56,48],iconAnchor:[28,24]});
  var carM=L.marker(latlngs[0],{icon:carIcon,zIndexOffset:1000}).addTo(map);
  var st={i:0,play:true,bat:parseFloat(rt.battery||60),soc:parseFloat(rt.soc||90),con:parseFloat(rt.consumption||18),el:null,hd:0};
  // ارتفاع
  var ns='http://www.w3.org/2000/svg',en=15,ela=[],elo=[];
  for(var ei=0;ei<en;ei++){var ec=coords[Math.round(ei*(coords.length-1)/(en-1))];ela.push(ec[1]);elo.push(ec[0]);}
  fetch('https://api.open-meteo.com/v1/elevation?latitude='+ela.join(',')+'&longitude='+elo.join(',')).then(function(r){return r.json();}).then(function(dd){
    if(dd&&dd.elevation){var esvg=document.getElementById('elev'),pd='M0,52 ',mn=1e9,mx=-1e9;
      dd.elevation.forEach(function(v){if(v<mn)mn=v;if(v>mx)mx=v;});
      dd.elevation.forEach(function(v,ii){var x=ii/(dd.elevation.length-1)*600,y=47-((v-mn)/((mx-mn)||1))*38;pd+='L'+x.toFixed(1)+','+y.toFixed(1)+' ';});
      pd+='L600,52Z';var p2=document.createElementNS(ns,'path');
      p2.setAttribute('d',pd);p2.setAttribute('fill','rgba(0,230,118,.3)');p2.setAttribute('stroke','#00e676');p2.setAttribute('stroke-width',2.5);
      esvg.appendChild(p2);
      var mk=document.createElementNS(ns,'circle');mk.setAttribute('id','emk');mk.setAttribute('r',6);
      mk.setAttribute('fill','#fff');mk.setAttribute('stroke','#00e676');mk.setAttribute('stroke-width',3);esvg.appendChild(mk);
      st.el=dd.elevation;st.elR={mn:mn,mx:mx};}
  }).catch(function(){});
  function fa(n){try{return Number(n).toLocaleString('fa-IR');}catch(e){return n;}}
  document.getElementById('bplay').onclick=function(){st.play=!st.play;this.textContent=st.play?'⏸':'▶';};
  var mapEl=document.getElementById('map'),comp=document.getElementById('compass');
  (function fr(){
    if(st.play){st.i+=1.4;if(st.i>=coords.length-1)st.i=0;}
    var ci=Math.round(st.i),pos=latlngs[ci];
    carM.setLatLng(pos);
    map.panTo(pos,{animate:false});
    // مسیر طی‌شده
    doneLine.setLatLngs(latlngs.slice(0,ci+1));
    // جهت حرکت برای چرخش
    if(ci<coords.length-2){
      var p1=coords[ci],p2=coords[ci+2];
      var ang=Math.atan2(p2[0]-p1[0],p2[1]-p1[1])*180/Math.PI;
      st.hd+=(((ang-st.hd+540)%360)-180)*0.06; // نرم
      mapEl.style.transform='rotate('+(-st.hd)+'deg)';
      comp.style.transform='rotate('+(st.hd)+'deg)';
    }
    var dk=(st.i/(coords.length-1))*km,pct=Math.max(0,Math.round(st.soc-(dk*st.con/100)/st.bat*100));
    document.getElementById('st1').innerHTML=fa(Math.round(dk*10)/10)+'<small>km</small>';
    var s2=document.getElementById('st2');s2.innerHTML=fa(pct)+'<small>٪</small>';s2.style.color=pct>20?'#fff':'#ff5252';
    if(st.el){var eii=Math.round((st.i/(coords.length-1))*(st.el.length-1));
      document.getElementById('st3').innerHTML=fa(Math.round(st.el[eii]))+'<small>m</small>';
      var mk2=document.getElementById('emk');
      if(mk2){mk2.setAttribute('cx',(st.i/(coords.length-1))*600);mk2.setAttribute('cy',47-((st.el[eii]-st.elR.mn)/((st.elR.mx-st.elR.mn)||1))*38);}}
    requestAnimationFrame(fr);
  })();
  document.getElementById('bshare').onclick=function(){
    var dc={o:rt.origin,d:rt.destination,k:Math.round(km*10)/10,b:st.bat,s:st.soc,c:st.con,
      c:coords.filter(function(_,ix){return ix%Math.max(1,Math.floor(coords.length/120))===0;}).map(function(p){return [Math.round(p[0]*1e5),Math.round(p[1]*1e5)];}),
      n:document.getElementById('pn').textContent};
    var url=location.origin+location.pathname+'#'+btoa(unescape(encodeURIComponent(JSON.stringify(dc))));
    if(navigator.share){navigator.share({title:'سفر من با رانش EV',url:url}).catch(function(){});}
    else{try{navigator.clipboard.writeText(url);alert('لینک کپی شد!');}catch(e){prompt('لینک:',url);}}
  };
})();
</script>
</body>
</html>
