<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>بررسی کسب‌وکارها | مدیریت REV</title>
<style>:root{--bg:#080b0d;--panel:#121a1f;--line:#2a343a;--muted:#aab6bc;--green:#39ff88}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f5f7f8;font:16px/1.9 Vazirmatn,Vazir,Tahoma,sans-serif}.wrap{width:min(1100px,calc(100% - 28px));margin:auto}header{padding:18px 0;border-bottom:1px solid var(--line)}a{color:var(--green)}input,select,textarea{background:#0c1215;color:#fff;border:1px solid #35464d;padding:10px;border-radius:8px;font:inherit;width:100%;margin:5px 0 10px}button{font:inherit;padding:8px 12px;border-radius:8px;border:1px solid #35464d;background:#162126;color:#fff;cursor:pointer}.primary{background:var(--green);color:#07100b;font-weight:800}.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin:12px 0}.muted{color:var(--muted);font-size:14px}.notice{padding:10px;border:1px solid #725a2c;border-radius:10px;margin:12px 0}.tabs{display:flex;gap:8px;flex-wrap:wrap}.tabs button.active{background:var(--green);color:#07100b}.item{border-top:1px solid var(--line);padding:14px 0}.actions{display:flex;gap:8px;flex-wrap:wrap}.danger{border-color:#944848;color:#ffb4b4}</style>
<link rel="stylesheet" href="./rev-theme.css?v=1">
</head><body><header><div class="wrap"><strong style="font-size:25px;color:var(--green)">REV · مدیریت کسب‌وکارها</strong>　<a href="./admin.html">پنل اصلی</a>　<a href="./businesses.html">نمای عمومی</a></div></header>
<main class="wrap"><h1>بررسی درخواست‌های کسب‌وکار و محصولات</h1><p class="muted">این صفحه فقط رابط مدیریت است؛ مجوز دسترسی در Worker سمت سرور بررسی می‌شود. توکن مدیر در این صفحه ذخیره دائمی نمی‌شود.</p>
<section class="card"><label>توکن مدیریت (همان ADMIN_TOKEN تنظیم‌شده در Cloudflare، بدون ارسال به کسی)<input id="token" type="password" autocomplete="current-password"></label><button class="primary" id="load">بارگذاری درخواست‌ها</button><button id="clear">پاک‌کردن توکن</button><div id="notice" class="notice">توکن را وارد کنید تا درخواست‌ها از API خوانده شوند.</div></section>
<div class="tabs"><button data-kind="business" class="active">کسب‌وکارها</button><button data-kind="product">محصولات</button></div><section class="card"><div id="list">هنوز داده‌ای بارگذاری نشده است.</div></section></main>
<script>
const API='https://rev-auth-api.mojtaba-alimi64.workers.dev', $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let kind='business',items={business:[],product:[]};
function say(t){$('#notice').textContent=t}
async function req(path,opts={}){const r=await fetch(API+path,{cache:'no-store',...opts,headers:{'Content-Type':'application/json','Authorization':'Bearer '+$('#token').value.trim(),...(opts.headers||{})}});const j=await r.json().catch(()=>({}));if(!r.ok||!j.success)throw Error(j.error||'درخواست ناموفق بود: '+r.status);return j}
function status(s){return ({pending:'در انتظار بررسی',approved:'تأییدشده',rejected:'ردشده',needs_review:'نیازمند بررسی بیشتر',suspended:'تعلیق‌شده'})[s]||s}
function draw(){const a=items[kind]||[];$('#list').innerHTML=a.length?a.map(x=>'<article class="item"><h2>'+esc(kind==='business'?x.name:x.title)+'</h2><p class="muted">'+(kind==='business'?esc(({store:'فروشگاه',repair:'تعمیرگاه',charging:'جایگاه شارژ'})[x.business_type]||x.business_type)+' · '+esc(x.city)+' · '+esc(x.address):'فروشگاه: '+esc(x.business_name)+' · '+esc(x.price_text||'قیمت درج نشده'))+'</p><p>'+esc(kind==='business'?x.description:x.description)+'</p><p>وضعیت: <strong>'+esc(status(x.status))+'</strong> · شناسه: <code>'+esc(x.id)+'</code></p>'+(x.moderation_note?'<p>یادداشت قبلی: '+esc(x.moderation_note)+'</p>':'')+'<label>یادداشت مدیر<textarea data-note="'+esc(x.id)+'" rows="2" maxlength="500">'+esc(x.moderation_note||'')+'</textarea></label><div class="actions"><button class="primary" data-review="'+esc(x.id)+'" data-status="approved">تأیید و انتشار</button><button data-review="'+esc(x.id)+'" data-status="needs_review">نیازمند بررسی بیشتر</button><button class="danger" data-review="'+esc(x.id)+'" data-status="rejected">رد درخواست</button></div></article>').join(''):'در این دسته درخواستی وجود ندارد.'}
async function load(){try{const j=await req('/api/admin/businesses');items.business=j.businesses||[];items.product=j.products||[];draw();say('داده‌ها بارگذاری شدند. تعداد کسب‌وکار: '+items.business.length+'، محصول: '+items.product.length)}catch(e){say(e.message)}}
$('#load').addEventListener('click',load);$('#clear').addEventListener('click',()=>{$('#token').value='';items={business:[],product:[]};draw();say('توکن پاک شد.')});
document.querySelectorAll('[data-kind]').forEach(b=>b.addEventListener('click',()=>{kind=b.dataset.kind;document.querySelectorAll('[data-kind]').forEach(z=>z.classList.toggle('active',z===b));draw()}));
document.addEventListener('click',async e=>{const b=e.target.closest('[data-review]');if(!b)return;const id=b.dataset.review,status=b.dataset.status,note=document.querySelector('[data-note="'+CSS.escape(id)+'"]')?.value||'';try{await req('/api/admin/'+(kind==='business'?'businesses':'products')+'/'+encodeURIComponent(id)+'/review',{method:'POST',body:JSON.stringify({status,note})});say('وضعیت ثبت شد.');await load()}catch(x){say(x.message)}});
</script></body></html>
