<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>بررسی کسب‌وکارها | مدیریت REV</title>
<style>:root{--bg:#080b0d;--panel:#121a1f;--line:#2a343a;--muted:#aab6bc;--green:#39ff88}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f5f7f8;font:16px/1.9 Vazirmatn,Vazir,Tahoma,sans-serif}.wrap{width:min(1100px,calc(100% - 28px));margin:auto}header{padding:18px 0;border-bottom:1px solid var(--line)}a{color:var(--green)}input,select,textarea{background:#0c1215;color:#fff;border:1px solid #35464d;padding:10px;border-radius:8px;font:inherit;width:100%;margin:5px 0 10px}button{font:inherit;padding:8px 12px;border-radius:8px;border:1px solid #35464d;background:#162126;color:#fff;cursor:pointer}.primary{background:var(--green);color:#07100b;font-weight:800}.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin:12px 0}.muted{color:var(--muted);font-size:14px}.notice{padding:10px;border:1px solid #725a2c;border-radius:10px;margin:12px 0}.tabs{display:flex;gap:8px;flex-wrap:wrap}.tabs button.active{background:var(--green);color:#07100b}.item{border-top:1px solid var(--line);padding:14px 0}.actions{display:flex;gap:8px;flex-wrap:wrap}.danger{border-color:#944848;color:#ffb4b4}.formgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}.feature-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:8px;margin:12px 0}.feature{display:flex;align-items:center;gap:8px;border:1px solid #35464d;border-radius:8px;padding:8px}.feature input{width:auto;margin:0}.item hr{border:0;border-top:1px solid var(--line);margin:18px 0}.item h3{color:var(--green);margin:6px 0}</style>
<link rel="stylesheet" href="./rev-theme.css?v=1">
</head><body><header><div class="wrap"><strong style="font-size:25px;color:var(--green)">REV · مدیریت کسب‌وکارها</strong>　<a href="./admin.html">پنل اصلی</a>　<a href="./businesses.html">نمای عمومی</a></div></header>
<main class="wrap"><h1>بررسی درخواست‌های کسب‌وکار و محصولات</h1><p class="muted">این صفحه فقط رابط مدیریت است؛ مجوز دسترسی در Worker سمت سرور بررسی می‌شود. توکن مدیر در این صفحه ذخیره دائمی نمی‌شود.</p>
<section class="card"><label>توکن مدیریت (همان ADMIN_TOKEN تنظیم‌شده در Cloudflare، بدون ارسال به کسی)<input id="token" type="password" autocomplete="current-password"></label><button class="primary" id="load">بارگذاری درخواست‌ها</button><button id="clear">پاک‌کردن توکن</button><div id="notice" class="notice">توکن را وارد کنید تا درخواست‌ها از API خوانده شوند.</div></section>
<div class="tabs"><button data-kind="business" class="active">کسب‌وکارها</button><button data-kind="product">محصولات</button></div><section class="card"><div id="list">هنوز داده‌ای بارگذاری نشده است.</div></section></main>
<script>
/* REV panel recovery + visible diagnostics */
(function () {
  function showError(message) {
    const box = document.getElementById('notice');
    if (box) box.textContent = 'خطای اجرای پنل: ' + String(message || 'خطای نامشخص') + ' — صفحه را با Ctrl+F5 تازه‌سازی کنید.';
  }
  window.addEventListener('error', function (event) {
    showError((event.message || 'JavaScript error') + (event.filename ? ' (' + event.filename.split('/').pop() + ':' + event.lineno + ')' : ''));
  });
  window.addEventListener('unhandledrejection', function (event) {
    const reason = event.reason;
    showError(reason && reason.message ? reason.message : reason);
  });
  document.addEventListener('click', function (event) {
    const tab = event.target.closest && event.target.closest('[data-kind]');
    if (!tab) return;
    try {
      if (typeof kind !== 'undefined') kind = tab.dataset.kind;
      document.querySelectorAll('[data-kind]').forEach(function (button) {
        button.classList.toggle('active', button === tab);
      });
      if (typeof draw === 'function') draw();
      else showError('کد اصلی پنل بارگذاری نشده است؛ صفحه را با Ctrl+F5 تازه‌سازی کنید.');
    } catch (error) {
      showError(error && error.message ? error.message : error);
    }
  }, true);
})();
</script>
<script>
const API='https://rev-auth-api.mojtaba-alimi64.workers.dev', $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let kind='business',items={business:[],product:[]};
function say(t){$('#notice').textContent=t}
async function req(path,opts={}){const r=await fetch(API+path,{cache:'no-store',...opts,headers:{'Content-Type':'application/json','Authorization':'Bearer '+$('#token').value.trim(),...(opts.headers||{})}});const j=await r.json().catch(()=>({}));if(!r.ok||!j.success)throw Error(j.error||'درخواست ناموفق بود: '+r.status);return j}
function status(s){return ({pending:'در انتظار بررسی',approved:'تأییدشده',rejected:'ردشده',needs_review:'نیازمند بررسی بیشتر',suspended:'تعلیق‌شده'})[s]||s}
let planCatalog={
 free:{name:'پایه — رایگان',options:[{id:'listing',label:'نمایش در فهرست',enabled:true},{id:'contact',label:'نمایش اطلاعات تماس',enabled:true},{id:'edit',label:'ویرایش اطلاعات پایه',enabled:true},{id:'product_catalog',label:'مدیریت فهرست محصولات',enabled:false}]},
 professional:{name:'حرفه‌ای',options:[{id:'listing',label:'نمایش در فهرست',enabled:true},{id:'contact',label:'اطلاعات تماس',enabled:true},{id:'edit',label:'ویرایش اطلاعات پایه',enabled:true},{id:'logo',label:'لوگو',enabled:true},{id:'photos',label:'گالری تصاویر',enabled:true},{id:'hours',label:'ساعات کاری',enabled:true},{id:'services',label:'خدمات و تخصص‌ها',enabled:true},{id:'links',label:'لینک‌های ارتباطی',enabled:true},{id:'stats',label:'آمار بازدید',enabled:true},{id:'product_catalog',label:'مدیریت فهرست محصولات',enabled:true}]},
 featured:{name:'ویژه',options:[{id:'listing',label:'نمایش در فهرست',enabled:true},{id:'contact',label:'اطلاعات تماس',enabled:true},{id:'edit',label:'ویرایش اطلاعات پایه',enabled:true},{id:'logo',label:'لوگو',enabled:true},{id:'photos',label:'گالری تصاویر',enabled:true},{id:'hours',label:'ساعات کاری',enabled:true},{id:'services',label:'خدمات و تخصص‌ها',enabled:true},{id:'links',label:'لینک‌های ارتباطی',enabled:true},{id:'stats',label:'آمار بازدید',enabled:true},{id:'product_catalog',label:'مدیریت فهرست محصولات',enabled:true},{id:'highlight',label:'نمایش برجسته',enabled:true},{id:'priority',label:'اولویت نمایش',enabled:true},{id:'map_pin',label:'پین روی نقشه',enabled:true},{id:'report',label:'گزارش تبلیغات',enabled:true}]},
 sponsor:{name:'سازمانی و اسپانسری',options:[{id:'listing',label:'نمایش در فهرست',enabled:true},{id:'contact',label:'اطلاعات تماس',enabled:true},{id:'product_catalog',label:'مدیریت فهرست محصولات',enabled:true},{id:'campaign',label:'کمپین اختصاصی',enabled:true},{id:'banner',label:'بنر تبلیغاتی',enabled:true},{id:'sponsored',label:'محتوای حمایت‌شده',enabled:true},{id:'social',label:'معرفی در شبکه‌های اجتماعی',enabled:true},{id:'report',label:'گزارش عملکرد',enabled:true},{id:'custom',label:'همکاری سفارشی',enabled:true}]}
};
function editorOptions(x){
 const code=$('[data-plan-code="'+CSS.escape(x.id)+'"]')?.value||x.plan_code||'free', p=planCatalog[code]||planCatalog.free;
 let saved={};try{saved=JSON.parse(x.plan_features_json||'{}')}catch(e){}
 const current= x.plan_code===code && x.plan_features_json ? saved : Object.fromEntries(p.options.map(o=>[o.id,o.enabled!==false]));
 if(!('product_catalog' in current))current.product_catalog=code!=='free';
 return '<div class="feature-grid">'+p.options.map(o=>'<label class="feature"><input type="checkbox" data-feature="'+esc(o.id)+'" '+(current[o.id]===true?'checked':'')+' '+(o.enabled===false?'disabled':'')+'>'+esc(o.label)+'</label>').join('')+(!p.options.some(o=>o.id==='product_catalog')?'<label class="feature"><input type="checkbox" data-feature="product_catalog" '+(current.product_catalog===true?'checked':'')+'>مدیریت فهرست محصولات</label>':'')+'</div>';
}
function draw(){const a=items[kind]||[];$('#list').innerHTML=a.length?a.map(x=>{
 const title=kind==='business'?x.name:x.title;
 const detail=kind==='business'?esc(({store:'فروشگاه',repair:'تعمیرگاه',charging:'جایگاه شارژ'})[x.business_type]||x.business_type)+' · '+esc(x.city)+' · '+esc(x.address):'فروشگاه: '+esc(x.business_name)+' · '+esc(x.price_text||'قیمت درج نشده');
 const planCode=x.plan_code||'free', planStatus=x.plan_status||'pending_payment', payment=x.plan_payment_status||'pending';
 const expiry=(x.plan_expires_at||'').slice(0,10);
 return '<article class="item" data-business-card="'+esc(x.id)+'"><h2>'+esc(title)+'</h2><p class="muted">'+detail+'</p><p>'+esc(x.description||'')+'</p><p>وضعیت بررسی: <strong>'+esc(status(x.status))+'</strong> · شناسه: <code>'+esc(x.id)+'</code></p>'+(x.moderation_note?'<p>یادداشت بررسی: '+esc(x.moderation_note)+'</p>':'')+'<label>یادداشت مدیر بررسی<textarea data-note="'+esc(x.id)+'" rows="2" maxlength="500">'+esc(x.moderation_note||'')+'</textarea></label><div class="actions"><button class="primary" data-review="'+esc(x.id)+'" data-status="approved">تأیید و انتشار</button>'+(kind==='business'?'<button data-review="'+esc(x.id)+'" data-status="needs_review">نیازمند بررسی بیشتر</button>':'')+'<button class="danger" data-review="'+esc(x.id)+'" data-status="rejected">رد درخواست</button></div>'+(kind==='business'?'<hr><h3>پلن، امکانات و وضعیت پرداخت</h3><div class="formgrid"><label>پلن<select data-plan-code="'+esc(x.id)+'">'+Object.entries(planCatalog).map(([k,p])=>'<option value="'+k+'" '+(k===planCode?'selected':'')+'>'+esc(p.name)+'</option>').join('')+'</select></label><label>وضعیت اشتراک<select data-plan-status="'+esc(x.id)+'"><option value="active" '+(planStatus==='active'?'selected':'')+'>فعال</option><option value="pending_payment" '+(planStatus==='pending_payment'?'selected':'')+'>در انتظار پرداخت</option><option value="expired" '+(planStatus==='expired'?'selected':'')+'>منقضی</option><option value="suspended" '+(planStatus==='suspended'?'selected':'')+'>تعلیق</option><option value="cancelled" '+(planStatus==='cancelled'?'selected':'')+'>لغو</option></select></label><label>وضعیت پرداخت<select data-payment-status="'+esc(x.id)+'"><option value="paid" '+(payment==='paid'?'selected':'')+'>پرداخت‌شده</option><option value="waived" '+(payment==='waived'?'selected':'')+'>رایگان/معاف از پرداخت</option><option value="pending" '+(payment==='pending'?'selected':'')+'>در انتظار پرداخت</option><option value="failed" '+(payment==='failed'?'selected':'')+'>ناموفق</option><option value="refunded" '+(payment==='refunded'?'selected':'')+'>بازپرداخت‌شده</option></select></label><label>تاریخ انقضا<input type="date" data-plan-expiry="'+esc(x.id)+'" value="'+esc(expiry)+'"></label></div><div data-feature-holder="'+esc(x.id)+'">'+editorOptions(x)+'</div><label>یادداشت پلن<textarea data-plan-note="'+esc(x.id)+'" rows="2" maxlength="500">'+esc(x.plan_admin_note||'')+'</textarea></label><div class="actions"><button class="primary" data-save-plan="'+esc(x.id)+'">ذخیره پلن و دسترسی‌ها</button></div><p class="muted">امکانات سمت سرور اعمال می‌شوند؛ فعال‌کردن پلن پولی فقط پس از تأیید پرداخت‌شده/معاف امکان‌پذیر است.</p>':'')+'</article>';
 }).join(''):'در این دسته درخواستی وجود ندارد.'}
async function load(){try{
 try{const cr=await fetch('./content.json?v='+Date.now(),{cache:'no-store'});if(cr.ok){const cd=await cr.json();for(const k of Object.keys(planCatalog)){const saved=cd.businessPlans?.[k]||{},base=planCatalog[k],opts=new Map([...(base.options||[]),...(saved.options||[])].map(o=>[o.id,{...(base.options||[]).find(z=>z.id===o.id),...o}]));if(!opts.has('product_catalog'))opts.set('product_catalog',{id:'product_catalog',label:'مدیریت فهرست محصولات',enabled:k!=='free'});planCatalog[k]={...base,...saved,options:[...opts.values()]};}}}catch(e){}
 const j=await req('/api/admin/businesses');items.business=j.businesses||[];items.product=j.products||[];draw();say('داده‌ها بارگذاری شدند. تعداد کسب‌وکار: '+items.business.length+'، محصول: '+items.product.length)
 }catch(e){say(e.message)}}
$('#load').addEventListener('click',load);$('#clear').addEventListener('click',()=>{$('#token').value='';items={business:[],product:[]};draw();say('توکن پاک شد.')});
document.querySelectorAll('[data-kind]').forEach(b=>b.addEventListener('click',()=>{kind=b.dataset.kind;document.querySelectorAll('[data-kind]').forEach(z=>z.classList.toggle('active',z===b));draw()}));
document.addEventListener('change',e=>{const sel=e.target.closest('[data-plan-code]');if(!sel)return;const card=sel.closest('[data-business-card]');if(!card)return;const holder=card.querySelector('[data-feature-holder]');const p=planCatalog[sel.value]||planCatalog.free;holder.innerHTML='<div class="feature-grid">'+p.options.map(o=>'<label class="feature"><input type="checkbox" data-feature="'+esc(o.id)+'" '+(o.enabled!==false?'checked':'')+' '+(o.enabled===false?'disabled':'')+'>'+esc(o.label)+'</label>').join('')+(!p.options.some(o=>o.id==='product_catalog')?'<label class="feature"><input type="checkbox" data-feature="product_catalog" '+(sel.value!=='free'?'checked':'')+'>مدیریت فهرست محصولات</label>':'')+'</div>'});
document.addEventListener('click',async e=>{const save=e.target.closest('[data-save-plan]');if(save){const id=save.dataset.savePlan,card=save.closest('[data-business-card]'),code=card.querySelector('[data-plan-code]').value,p=planCatalog[code]||planCatalog.free,features={};card.querySelectorAll('[data-feature]').forEach(c=>features[c.dataset.feature]=c.checked);const expiry=card.querySelector('[data-plan-expiry]').value;if(!expiry){say('تاریخ انقضای پلن را انتخاب کنید.');return}try{const r=await req('/api/admin/businesses/'+encodeURIComponent(id)+'/plan',{method:'POST',body:JSON.stringify({planCode:code,planName:p.name,planStatus:card.querySelector('[data-plan-status]').value,paymentStatus:card.querySelector('[data-payment-status]').value,expiresAt:new Date(expiry+'T23:59:59').toISOString(),features,note:card.querySelector('[data-plan-note]').value})});say(r.message||'پلن ذخیره شد.');await load()}catch(x){say(x.message)}return}const b=e.target.closest('[data-review]');if(!b)return;const id=b.dataset.review,status=b.dataset.status,note=document.querySelector('[data-note="'+CSS.escape(id)+'"]')?.value||'';try{await req('/api/admin/'+(kind==='business'?'businesses':'products')+'/'+encodeURIComponent(id)+'/review',{method:'POST',body:JSON.stringify({status,note})});say('وضعیت ثبت شد.');await load()}catch(x){say(x.message)}});
</script></body></html>
