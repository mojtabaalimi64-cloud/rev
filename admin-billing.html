<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>بررسی درخواست‌های پرداخت | REV</title><link rel="stylesheet" href="./rev-theme.css?v=1"><style>
*{box-sizing:border-box}body{margin:0;background:#eef3f4;color:#142027;font:15px/1.9 Vazirmatn,Vazir,Tahoma,sans-serif}.wrap{width:min(1000px,calc(100% - 24px));margin:22px auto}header,.card{background:white;border:1px solid #d9e4e5;border-radius:15px;padding:18px;margin-bottom:14px}h1{font-size:25px;margin-top:0}label{display:block;margin:10px 0 4px}input,textarea,select{width:100%;padding:10px;border:1px solid #b8c7cc;border-radius:9px;font:inherit}button{border:0;border-radius:9px;padding:9px 13px;background:#07100e;color:#fff;font:inherit;cursor:pointer;margin:4px}button.ok{background:#087a50}button.no{background:#9f2e2e}.muted{color:#5b666d}.order{border:1px solid #d9e4e5;border-radius:12px;padding:14px;margin:10px 0}.pending{color:#8a5b00;font-weight:bold}.actions{display:flex;gap:8px;flex-wrap:wrap}.hidden{display:none!important}#msg{white-space:pre-wrap}
</style></head><body><main class="wrap"><header><h1>مدیریت درخواست‌های پلن مسیریابی REV</h1><p class="muted">این صفحه فقط برای مدیر است. توکن مدیریتی را در این صفحه ذخیره نمی‌کنیم و هرگز در کد سایت قرار ندهید.</p><a href="./admin.html">بازگشت به پنل مدیریت اصلی</a></header><section class="card"><label>توکن مدیریتی Cloudflare (ADMIN_TOKEN)<input id="token" type="password" autocomplete="off"></label><div class="actions"><button id="load">بارگذاری درخواست‌ها</button><button id="clear">پاک‌کردن توکن</button></div><p id="msg" class="muted"></p></section><section class="card"><h2>درخواست‌ها</h2><div id="orders">ابتدا توکن مدیریتی را وارد و درخواست‌ها را بارگذاری کنید.</div></section></main><script>
const API='https://rev-auth-api.mojtaba-alimi64.workers.dev',el=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),money=n=>Number(n||0).toLocaleString('fa-IR')+' تومان';
async function call(path,opts={}){const token=el('token').value.trim();const r=await fetch(API+path,{cache:'no-store',...opts,headers:{'Content-Type':'application/json','Authorization':'Bearer '+token,...(opts.headers||{})}}),j=await r.json().catch(()=>({}));if(!r.ok||!j.success)throw Error(r.status===401?'توکن مدیریتی معتبر نیست.':j.error||'خطای سرور');return j}
async function load(){el('msg').textContent='در حال دریافت…';try{const j=await call('/api/admin/billing/orders');const list=j.orders||[];el('orders').innerHTML=list.length?list.map(o=>'<article class="order"><strong>'+esc(o.display_name||'کاربر')+'</strong> · '+esc(o.email_normalized||'')+'<p>پلن: '+esc(o.plan_code)+' · مبلغ: '+money(o.amount_toman)+'</p><p>شناسه: <code>'+esc(o.id)+'</code></p><p>وضعیت: <span class="pending">'+esc(o.status)+'</span> · زمان: '+esc(new Date(o.created_at).toLocaleString('fa-IR'))+'</p><label>شماره پیگیری پرداخت / توضیح<input data-ref="'+esc(o.id)+'" value="'+esc(o.reference||'')+'" maxlength="120"></label><label>یادداشت مدیر<textarea data-note="'+esc(o.id)+'" maxlength="500">'+esc(o.admin_note||'')+'</textarea></label>'+(o.status==='pending'?'<div class="actions"><button class="ok" data-review="approved" data-id="'+esc(o.id)+'">تأیید پرداخت و فعال‌سازی</button><button class="no" data-review="rejected" data-id="'+esc(o.id)+'">رد درخواست</button></div>':'')+'</article>').join(''):'درخواستی ثبت نشده است.';el('msg').textContent='تعداد درخواست‌ها: '+list.length}catch(e){el('msg').textContent=e.message}}
el('load').addEventListener('click',load);el('clear').addEventListener('click',()=>{el('token').value='';el('orders').textContent='توکن پاک شد.';el('msg').textContent=''});
el('orders').addEventListener('click',async e=>{const b=e.target.closest('[data-review]');if(!b)return;const id=b.dataset.id;const reference=document.querySelector('[data-ref="'+CSS.escape(id)+'"]').value;const note=document.querySelector('[data-note="'+CSS.escape(id)+'"]').value;if(!confirm(b.dataset.review==='approved'?'پرداخت را خارج از این صفحه تأیید کرده‌اید؟ با ادامه، دسترسی مسیریابی فعال می‌شود.':'درخواست خرید رد شود؟'))return;b.disabled=true;try{const j=await call('/api/admin/billing/orders/'+encodeURIComponent(id)+'/review',{method:'POST',body:JSON.stringify({status:b.dataset.review,reference,note})});el('msg').textContent=j.message;await load()}catch(err){el('msg').textContent=err.message}finally{b.disabled=false}});
</script></body></html>
