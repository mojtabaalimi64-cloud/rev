<script>
(function(){
 const BUSINESS_API="https://rev-auth-api.mojtaba-alimi64.workers.dev";
 const STATION_API="https://rev-api.mojtaba-alimi64.workers.dev";
 const status=document.getElementById("status"),detailsPanel=document.getElementById("details-panel"),detailsContent=document.getElementById("details-content"),filter=document.getElementById("filter");
 detailsContent.addEventListener("click",function(e){const tab=e.target.closest("[data-detail-tab]");if(!tab)return;const features=tab.dataset.detailTab==="features";detailsContent.querySelectorAll("[data-detail-tab]").forEach(b=>b.setAttribute("aria-selected",String(b===tab)));const rp=detailsContent.querySelector("#reviewsPanel"),fp=detailsContent.querySelector("#featuresPanel");if(rp)rp.hidden=features;if(fp)fp.hidden=!features;});
 const map=L.map("map",{scrollWheelZoom:false}).setView([32.4,53.7],5);
 L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"&copy; OpenStreetMap"}).addTo(map);
 const markers=L.featureGroup().addTo(map);let userLocation=null,userMarker=null,all=[];
 const typeNames={charging:"ایستگاه شارژ",repair:"تعمیرگاه",store:"فروشگاه قطعات"};
 function esc(value){return String(value==null?"":value).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];});}
 function distance(a,b){const R=6371,rad=n=>n*Math.PI/180,d1=rad(b[0]-a[0]),d2=rad(b[1]-a[1]),q=Math.sin(d1/2)*Math.sin(d1/2)+Math.cos(rad(a[0]))*Math.cos(rad(b[0]))*Math.sin(d2/2)*Math.sin(d2/2);return 2*R*Math.asin(Math.sqrt(q));}
 function showDetails(x){
  const rating=Number(x.average_rating??x.rating_average??x.rating??0);
  const ratingCount=Number(x.rating_count??x.ratings_count??x.reviews_count??x.review_count??0);
  const reviews=Array.isArray(x.reviews)?x.reviews:[];
  const url="https://www.openstreetmap.org/?mlat="+Number(x.latitude)+"&mlon="+Number(x.longitude)+"#map=16/"+Number(x.latitude)+"/"+Number(x.longitude);
  detailsContent.innerHTML="<span class=\"detail-type\">"+esc(typeNames[x.business_type]||"مرکز خدمات")+"</span><h2 class=\"detail-name\">"+esc(x.name||"مرکز REV")+"</h2><div class=\"detail-meta\">"+esc(x.city||"")+"<br>"+esc(x.address||"نشانی ثبت نشده")+(x._distance!=null?"<br>فاصله از شما: "+x._distance.toFixed(1)+" کیلومتر":"")+"</div><div class=\"detail-actions\">"+(x.phone?"<a href=\"tel:"+esc(x.phone)+"\">☎ تماس</a>":"")+"<a href=\""+url+"\" target=\"_blank\" rel=\"noopener noreferrer\">↗ مسیریابی</a></div>"+(x.description?"<p class=\"detail-meta\">"+esc(x.description)+"</p>":"")+"<div class=\"detail-tabs\" role=\"tablist\" aria-label=\"بخش‌های اطلاعات مرکز\"><button type=\"button\" class=\"detail-tab\" role=\"tab\" id=\"reviewsTab\" aria-controls=\"reviewsPanel\" aria-selected=\"true\" data-detail-tab=\"reviews\">امتیاز و نظرات</button><button type=\"button\" class=\"detail-tab\" role=\"tab\" id=\"featuresTab\" aria-controls=\"featuresPanel\" aria-selected=\"false\" data-detail-tab=\"features\">امکانات بیشتر</button></div><section id=\"reviewsPanel\" class=\"detail-tab-panel\" role=\"tabpanel\" aria-labelledby=\"reviewsTab\"><div class=\"rating-summary\"><div class=\"rating-score\">"+(rating>0?rating.toFixed(1):"—")+"</div><div><div>"+(rating>0?"★".repeat(Math.max(1,Math.min(5,Math.round(rating)))):"☆☆☆☆☆")+"</div><small>"+(ratingCount>0?ratingCount+" امتیاز و نظر ثبت‌شده":"هنوز امتیاز یا نظر ثبت‌شده‌ای در داده‌های دریافتی وجود ندارد")+"</small></div></div><section class=\"review-section\"><h3>نظرات کاربران</h3>"+(reviews.length?reviews.slice(0,10).map(r=>"<div class=\"review-entry\"><strong>"+esc(r.user_name||r.name||"کاربر REV")+"</strong><small> · "+esc(r.rating||"—")+" از ۵</small><div>"+esc(r.comment||r.text||r.review||"")+"</div></div>").join(""):"<div class=\"review-empty\">نظری برای نمایش در اطلاعات دریافتی این مرکز موجود نیست.</div>")+"</section></section><section id=\"featuresPanel\" class=\"detail-tab-panel\" role=\"tabpanel\" aria-labelledby=\"featuresTab\" hidden><div class=\"feature-placeholder\"><strong>امکانات تکمیلی این مرکز</strong><p>این بخش برای افزودن قابلیت‌های جدید آماده شده است. می‌توانیم امکانات واقعی هر مرکز را در این قسمت نمایش دهیم.</p><div class=\"feature-chips\"><span>ساعات فعالیت</span><span>عکس‌های مرکز</span><span>وضعیت فعال بودن</span><span>گزارش مشکل</span></div></div></section>";
  detailsPanel.hidden=false;
  setTimeout(()=>map.invalidateSize(),80);
 }
 function render(){
  markers.clearLayers();
  const valid=all.filter(x=>x.latitude!==null&&x.latitude!==undefined&&x.latitude!==""&&x.longitude!==null&&x.longitude!==undefined&&x.longitude!==""&&Number.isFinite(Number(x.latitude))&&Number.isFinite(Number(x.longitude))&&Math.abs(Number(x.latitude))<=90&&Math.abs(Number(x.longitude))<=180);
  const kind=filter.value;
  const shown=valid.filter(x=>kind==="all"||x.business_type===kind).map(x=>Object.assign({},x,{_distance:userLocation?distance(userLocation,[Number(x.latitude),Number(x.longitude)]):null})).sort((a,b)=>(a._distance==null?Infinity:a._distance)-(b._distance==null?Infinity:b._distance));
  shown.forEach(x=>{
   const marker=L.marker([Number(x.latitude),Number(x.longitude)]).addTo(markers);
   marker.on("click",()=>showDetails(x));
  });
  if(!userLocation&&markers.getLayers().length){const bounds=markers.getBounds();if(bounds.isValid())map.fitBounds(bounds.pad(.15),{maxZoom:13});}
  status.textContent=valid.length+" مرکز دارای مختصات از "+all.length+" مرکز ثبت‌شده بارگذاری شد."+(userLocation?" نزدیک‌ترین مراکز ابتدا نمایش داده می‌شوند.":" برای مرتب‌سازی بر اساس فاصله، مکان‌یابی را فعال کنید.");
  setTimeout(()=>map.invalidateSize(),100);
 }
 async function load(){
  status.textContent="در حال دریافت جایگاه‌ها و مراکز REV…";
  const requests=await Promise.allSettled([
   fetch(BUSINESS_API+"/api/businesses",{cache:"no-store"}).then(async r=>{const j=await r.json();if(!r.ok||!j.success)throw Error("businesses");return j.businesses||[]}),
   fetch(STATION_API+"/api/stations",{cache:"no-store"}).then(async r=>{const j=await r.json();if(!r.ok||j.success===false)throw Error("stations");return j.stations||[]}),
   fetch("./content.json?v="+Date.now(),{cache:"no-store"}).then(async r=>{if(!r.ok)throw Error("content");return r.json()})
  ]);
  const businesses=requests[0].status==="fulfilled"?requests[0].value:[];
  const stations=requests[1].status==="fulfilled"?requests[1].value:[];
  const legacy=requests[2].status==="fulfilled"?requests[2].value:{};
  const normalizeBusiness=(x,type)=>({id:x.id||x.publicCode||x.profileSlug||x.title||x.name,name:x.name||x.title||x.profileName||"مرکز REV",business_type:type,city:x.city||x.cityName||"",address:x.address||x.location||"",phone:x.phone||"",latitude:x.latitude??x.lat??"",longitude:x.longitude??x.lng??x.lon??"",source:"REV"});
  const oldBusinesses=[
   ...(legacy.serviceCenters||[]).map(x=>normalizeBusiness(x,"repair")),
   ...(legacy.partsStores||[]).map(x=>normalizeBusiness(x,"store")),
   ...(legacy.stations||[]).map(x=>normalizeBusiness(x,"charging"))
  ];
  const modernBusinesses=businesses.map(x=>({...x,source:"REV"}));
  const modernStations=stations.map(x=>normalizeBusiness(x,"charging"));
  const unique=new Map();
  [...modernBusinesses,...modernStations,...oldBusinesses].forEach(x=>{
   const key=String(x.id||"")+"|"+String(x.name||"")+"|"+String(x.latitude??"")+"|"+String(x.longitude??"");
   if(!unique.has(key))unique.set(key,x);
  });
  all=[...unique.values()];
  const okCount=requests.filter(x=>x.status==="fulfilled").length;
  if(!okCount){status.textContent="دریافت داده‌های نقشه ناموفق بود؛ اتصال اینترنت را بررسی و دوباره تلاش کنید.";return;}
  render();
  if(!all.length)status.textContent="فهرست‌ها بارگذاری شدند اما هنوز داده‌ای ثبت نشده است.";
 }
 async function locate(){if(!navigator.geolocation){status.textContent="این مرورگر از مکان‌یابی پشتیبانی نمی‌کند.";return;}status.textContent="در حال دریافت موقعیت؛ اجازه دسترسی را تأیید کنید…";navigator.geolocation.getCurrentPosition(async p=>{userLocation=[p.coords.latitude,p.coords.longitude];if(userMarker)map.removeLayer(userMarker);let avatar="";try{const r=await fetch(BUSINESS_API+"/api/portal/me",{method:"GET",credentials:"include",cache:"no-store"});if(r.ok){const j=await r.json();const candidate=j?.user?.avatar_data;if(j.success&&typeof candidate==="string"&&/^data:image\/(jpeg|png|webp);base64,/.test(candidate)&&candidate.length<=350000)avatar=candidate;}}catch(e){}if(avatar){const icon=L.divIcon({className:"rev-user-location-icon",html:'<span class="rev-user-photo-marker"><img src="'+avatar+'" alt=""></span>',iconSize:[42,42],iconAnchor:[21,21],popupAnchor:[0,-22]});userMarker=L.marker(userLocation,{icon,zIndexOffset:1000}).bindPopup("موقعیت فعلی شما").addTo(map);}else{userMarker=L.circleMarker(userLocation,{radius:8,color:"#fff",weight:3,fillColor:"#0866ff",fillOpacity:1}).bindPopup("موقعیت فعلی شما").addTo(map);}map.setView(userLocation,13);render();userMarker.openPopup();},()=>{status.textContent="موقعیت دریافت نشد؛ مجوز مکان‌یابی و GPS را بررسی کنید. نقشه را می‌توانید دستی جابه‌جا کنید."},{enableHighAccuracy:true,timeout:15000,maximumAge:60000});}

 function renderSearchHistory(){historyList.innerHTML="";if(!searchHistory.length){historyList.innerHTML='<div class="history-empty">هنوز جست‌وجویی ثبت نشده است. مکان موردنظرت را جست‌وجو کن.</div>';document.getElementById("clearSearchHistory").hidden=true;return;}document.getElementById("clearSearchHistory").hidden=false;searchHistory.forEach(function(term){const b=document.createElement("button");b.type="button";b.className="history-item";b.innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m16 16 4 4M11 7v4l3 2"></path></svg><span></span>';b.querySelector("span").textContent=term;b.addEventListener("click",function(){searchInput.value=term;closeSearchHistory();searchForm.requestSubmit();});historyList.appendChild(b);});}
 const historyToggle=document.getElementById("historyToggle");
  function openSearchHistory(){historyPanel.classList.add("open");historyPanel.setAttribute("aria-hidden","false");searchBar.classList.add("expanded");historyToggle.setAttribute("aria-expanded","true");renderSearchHistory();}
  function closeSearchHistory(){historyPanel.classList.remove("open");historyPanel.setAttribute("aria-hidden","true");searchBar.classList.remove("expanded");historyToggle.setAttribute("aria-expanded","false");}
  historyToggle.addEventListener("click",function(){if(historyPanel.classList.contains("open"))closeSearchHistory();else openSearchHistory();});

 let dragStartY=null,dragStartX=null,dragMoved=false;
  historyToggle.addEventListener("pointerdown",function(e){dragStartY=e.clientY;dragStartX=e.clientX;dragMoved=false;try{historyToggle.setPointerCapture(e.pointerId);}catch(err){}});
  historyToggle.addEventListener("pointermove",function(e){if(dragStartY===null)return;const dy=e.clientY-dragStartY,dx=e.clientX-dragStartX;if(Math.abs(dy)>12&&Math.abs(dy)>Math.abs(dx))dragMoved=true;});
  historyToggle.addEventListener("pointerup",function(e){if(dragStartY===null)return;const dy=e.clientY-dragStartY,dx=e.clientX-dragStartX;if(dy < -12&&Math.abs(dy)>Math.abs(dx))openSearchHistory();else if(dy>12&&Math.abs(dy)>Math.abs(dx))closeSearchHistory();dragStartY=null;dragStartX=null;if(dragMoved)e.preventDefault();});
