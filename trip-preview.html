<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>پیش‌نمایش سفر | REV</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--teal:#14b8a6;--teal-d:#0d9488;--bg:#06121a}
html,body{height:100%;overflow:hidden;background:#000;font-family:Tahoma,Arial,sans-serif;color:#fff}
#stage{position:relative;width:100%;height:100dvh;overflow:hidden}
#bgvid{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#vignette{position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse at center,transparent 55%,rgba(0,10,15,.55) 100%)}
#scan{position:absolute;inset:0;pointer-events:none;opacity:.06;
  background:repeating-linear-gradient(0deg,transparent,transparent 3px,#0ff 4px)}
.hud{position:absolute;inset:0;pointer-events:none;z-index:5}
.glass{background:rgba(6,20,26,.55);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border:1px solid rgba(20,184,166,.35);border-radius:18px;
  box-shadow:0 0 24px rgba(20,184,166,.15),inset 0 1px 0 rgba(255,255,255,.08)}
/* top bar */
#topbar{position:absolute;top:max(14px,env(safe-area-inset-top));left:12px;right:12px;
  display:flex;justify-content:space-between;align-items:center;gap:8px}
.chip{padding:8px 14px;font-size:13px;font-weight:700;display:flex;align-items:center;gap:6px}
#clock{font-size:18px;letter-spacing:1px}
/* route */
#route{position:absolute;top:76px;left:12px;right:12px;padding:12px 16px}
#route .cities{display:flex;justify-content:space-between;font-weight:800;font-size:15px;margin-bottom:10px}
#route .track{position:relative;height:6px;border-radius:3px;background:rgba(255,255,255,.12)}
#route .fill{position:absolute;top:0;bottom:0;right:0;border-radius:3px;
  background:linear-gradient(90deg,var(--teal-d),var(--teal));box-shadow:0 0 12px var(--teal);
  transition:width 1s ease}
#route .dot{position:absolute;top:50%;width:16px;height:16px;border-radius:50%;
  background:var(--teal);border:3px solid #fff;box-shadow:0 0 16px var(--teal);
  transform:translate(50%,-50%);transition:right 1s ease}
/* weather */
#weather{position:absolute;top:170px;left:12px;padding:10px 14px;display:flex;align-items:center;gap:10px}
#weather .t{font-size:26px;font-weight:800}
#weather .d{font-size:11px;color:#9fd8d0}
/* charger alert */
#charger{position:absolute;top:250px;left:12px;padding:10px 14px;display:flex;align-items:center;gap:10px;
  animation:pulseB 2s infinite}
@keyframes pulseB{0%,100%{box-shadow:0 0 12px rgba(20,184,166,.2)}50%{box-shadow:0 0 28px rgba(20,184,166,.55)}}
#charger .bolt{font-size:26px;filter:drop-shadow(0 0 6px #ffd34d)}
#charger .km{font-size:22px;font-weight:800;color:#ffd34d}
/* speed */
#speed{position:absolute;bottom:max(24px,env(safe-area-inset-bottom));left:12px;
  width:150px;height:150px;display:flex;flex-direction:column;align-items:center;justify-content:center}
#speed .num{font-size:52px;font-weight:900;line-height:1;text-shadow:0 0 20px rgba(20,184,166,.6)}
#speed .lbl{font-size:11px;color:#9fd8d0;margin-top:4px}
#speedRing{position:absolute;inset:6px;transform:rotate(-90deg)}
/* distance */
#dist{position:absolute;bottom:max(24px,env(safe-area-inset-bottom));right:12px;
  width:150px;height:150px;display:flex;flex-direction:column;align-items:center;justify-content:center}
#dist .num{font-size:44px;font-weight:900;line-height:1}
#dist .lbl{font-size:11px;color:#9fd8d0;margin-top:4px}
/* battery */
#batt{position:absolute;bottom:max(190px,calc(env(safe-area-inset-bottom) + 166px));left:50%;
  transform:translateX(-50%);padding:8px 18px;display:flex;align-items:center;gap:10px}
#batt .bar{width:90px;height:10px;border-radius:5px;background:rgba(255,255,255,.15);overflow:hidden}
#batt .fillb{height:100%;border-radius:5px;background:linear-gradient(90deg,var(--teal-d),var(--teal));
  box-shadow:0 0 10px var(--teal)}
/* mini map */
#minimap{position:absolute;bottom:max(190px,calc(env(safe-area-inset-bottom) + 166px));right:12px;
  width:170px;height:130px;border-radius:16px;overflow:hidden;z-index:6;
  border:1px solid rgba(20,184,166,.4);box-shadow:0 0 20px rgba(20,184,166,.2)}
#minimap .leaflet-container{background:#0a1a22;font-family:Tahoma}
/* destination banner */
#destBanner{position:absolute;top:38%;left:0;right:0;text-align:center;opacity:0;pointer-events:none;
  transition:opacity .8s}
#destBanner.show{opacity:1}
#destBanner .big{font-size:34px;font-weight:900;text-shadow:0 0 30px var(--teal)}
/* config hint */
#hint{position:absolute;bottom:4px;left:0;right:0;text-align:center;font-size:10px;color:rgba(255,255,255,.35)}
.fadein{animation:fi .9s ease both}
@keyframes fi{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<div id="stage">
  <video id="bgvid" autoplay muted loop playsinline preload="auto" poster="https://mojtabaalimi64-cloud.github.io/rev/poster.jpg">
    <source src="https://mojtabaalimi64-cloud.github.io/rev/bg-road-small.mp4" type="video/mp4">
  </video>
  <div id="vignette"></div><div id="scan"></div>

  <div class="hud">
    <div id="topbar">
      <div class="glass chip fadein" id="clock">۱۷:۴۵</div>
      <div class="glass chip fadein" style="animation-delay:.1s">REV ⚡ پیش‌نمایش سفر</div>
      <div class="glass chip fadein" style="animation-delay:.2s">🔋 <span id="battPct">۶۸٪</span></div>
    </div>

    <div id="route" class="glass fadein" style="animation-delay:.25s">
      <div class="cities"><span id="cOrigin">تهران</span><span id="cDest">چالوس</span></div>
      <svg id="routeSvg" viewBox="0 0 600 80" preserveAspectRatio="none" style="width:100%;height:44px;display:block">
        <path id="routePathBg" d="" fill="none" stroke="rgba(255,255,255,.15)" stroke-width="5" stroke-linecap="round"/>
        <path id="routePathFill" d="" fill="none" stroke="#14b8a6" stroke-width="5" stroke-linecap="round"
          style="filter:drop-shadow(0 0 6px #14b8a6)"/>
        <circle id="routeDot" r="8" fill="#14b8a6" stroke="#fff" stroke-width="3"
          style="filter:drop-shadow(0 0 8px #14b8a6)"/>
      </svg>
      <div style="display:flex;justify-content:space-between;font-size:11px;color:#9fd8d0;margin-top:4px">
        <span id="rPct">۳۵٪ مسیر</span><span id="rEta">زمان تقریبی: --</span>
      </div>
    </div>

    <div id="weather" class="glass fadein" style="animation-delay:.35s">
      <div><div class="t"><span id="wTemp">۲۴</span>°</div><div class="d" id="wDesc">صاف و آفتابی</div></div>
      <div style="font-size:30px" id="wIcon">☀️</div>
    </div>

    <div id="charger" class="glass fadein" style="animation-delay:.45s">
      <div class="bolt">⚡</div>
      <div><div class="km"><span id="chKm">۳۲</span> کیلومتر</div>
      <div style="font-size:11px;color:#9fd8d0">شارژر بعدی • <span id="chPorts">۴</span> پورت آزاد</div></div>
    </div>

    <div id="speed" class="glass fadein" style="animation-delay:.55s">
      <svg id="speedRing" viewBox="0 0 100 100">
        <circle cx="50" cy="50" r="44" fill="none" stroke="rgba(255,255,255,.1)" stroke-width="6"/>
        <circle id="speedArc" cx="50" cy="50" r="44" fill="none" stroke="#14b8a6" stroke-width="6"
          stroke-linecap="round" stroke-dasharray="276" stroke-dashoffset="180"
          style="filter:drop-shadow(0 0 6px #14b8a6);transition:stroke-dashoffset 1s"/>
      </svg>
      <div class="num" id="spdNum">۱۱۰</div><div class="lbl">کیلومتر بر ساعت</div>
    </div>

    <div id="dist" class="glass fadein" style="animation-delay:.65s">
      <div class="num" id="dstNum">۱۴۵</div><div class="lbl">کیلومتر تا مقصد</div>
    </div>

    <div id="batt" class="glass fadein" style="animation-delay:.7s">
      <span style="font-size:13px">باتری</span>
      <div class="bar"><div class="fillb" id="battFill" style="width:68%"></div></div>
      <span style="font-weight:800" id="battPct2">۶۸٪</span>
    </div>

    <div id="minimap" class="fadein" style="animation-delay:.8s"></div>

    <div id="destBanner"><div class="big">به مقصد رسیدی! 🎉</div></div>
  </div>
  <div id="hint">قالب پیش‌نمایش سفر REV</div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const FA_D = s => String(s).replace(/[0-9]/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]);
/* ===== API: سایت با این تابع هر مسیری رو رندر می‌کنه ===== */
const REVPreview = {
  map: null, routeLine: null, routeGlow: null, chargerMarkers: [], _routeLen: 0,
  config: {origin:'تهران', destination:'چالوس', progress:35, speed:110,
    distanceKm:145, battery:68, temp:24, weatherDesc:'صاف و آفتابی',
    weatherIcon:'☀️', nextChargerKm:32, chargerPorts:4,
    originLL:[35.6892,51.3890], destLL:[36.6540,51.4210], chargers:[]},

  init(cfg={}){
    Object.assign(this.config, cfg);
    this.render();
    this.initMap();
    this.tick();
    setInterval(()=>this.tick(), 1000);
  },
  render(){
    const c = this.config;
    document.getElementById('cOrigin').textContent = c.origin;
    document.getElementById('cDest').textContent = c.destination;
    document.getElementById('rPct').textContent = FA_D(c.progress) + '٪ مسیر';
    this.updateRouteDot();
    document.getElementById('spdNum').textContent = FA_D(c.speed);
    document.getElementById('speedArc').style.strokeDashoffset = 276 - (276 * Math.min(c.speed,200)/200);
    document.getElementById('dstNum').textContent = FA_D(c.distanceKm);
    document.getElementById('battFill').style.width = c.battery + '%';
    document.getElementById('battPct').textContent = FA_D(c.battery) + '٪';
    document.getElementById('battPct2').textContent = FA_D(c.battery) + '٪';
    document.getElementById('wTemp').textContent = FA_D(c.temp);
    document.getElementById('wDesc').textContent = c.weatherDesc;
    document.getElementById('wIcon').textContent = c.weatherIcon;
    document.getElementById('chKm').textContent = FA_D(c.nextChargerKm);
    document.getElementById('chPorts').textContent = FA_D(c.chargerPorts);
    if(c.progress >= 100) document.getElementById('destBanner').classList.add('show');
  },
  setRoute(cfg){ Object.assign(this.config, cfg); this.render(); this.drawRoute(); },
  initMap(){
    const c = this.config;
    this.map = L.map('minimap', {zoomControl:false, attributionControl:false}).setView(c.originLL, 9);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',{maxZoom:19}).addTo(this.map);
    setTimeout(()=>this.map.invalidateSize(), 400);
    this.drawRoute();
  },
  drawRoute(){
    const c = this.config;
    const oD = `${c.originLL[1]},${c.originLL[0]};${c.destLL[1]},${c.destLL[0]}`;
    const servers = [
      `https://router.project-osrm.org/route/v1/driving/${oD}?overview=full&geometries=geojson`,
      `https://routing.openstreetmap.de/routed-car/route/v1/driving/${oD}?overview=full&geometries=geojson`
    ];
    const tryFetch = (i) => {
      if(i >= servers.length) return this.drawCurved();
      fetch(servers[i]).then(r=>r.json()).then(d=>{
        if(d.code!=='Ok'&&d.code!=='OK'||!d.routes||!d.routes[0]) return tryFetch(i+1);
        const coords = d.routes[0].geometry.coordinates;
        const latlngs = coords.map(p=>[p[1],p[0]]);
        c._routeLL = latlngs;
        if(this.routeLine) this.map.removeLayer(this.routeLine);
        if(this.routeGlow) this.map.removeLayer(this.routeGlow);
        this.routeGlow = L.polyline(latlngs,{color:'#14b8a6',weight:10,opacity:.25}).addTo(this.map);
        this.routeLine = L.polyline(latlngs,{color:'#14b8a6',weight:4,opacity:.95}).addTo(this.map);
        this.map.fitBounds(L.latLngBounds(latlngs).pad(0.25));
        this.drawRouteSvg(latlngs);
        const mins = Math.round(d.routes[0].duration/60);
        const hrs = Math.floor(mins/60), mm = mins%60;
        document.getElementById('rEta').textContent = 'زمان تقریبی: ' +
          (hrs>0 ? FA_D(hrs)+' ساعت و ' : '') + FA_D(mm) + ' دقیقه';
      }).catch(()=>tryFetch(i+1));
    };
    tryFetch(0);
    this.drawMarkers();
  },
  drawCurved(){
    // فالبک: مسیر منحنی زیبا به‌جای خط صاف
    const c=this.config;
    const [la1,ln1]=c.originLL, [la2,ln2]=c.destLL;
    const pts=[];
    for(let i=0;i<=40;i++){
      const t=i/40;
      const curve=Math.sin(t*Math.PI)*0.15; // انحنا
      pts.push([la1+(la2-la1)*t+curve*(ln2-ln1)*0.3, ln1+(ln2-ln1)*t-curve*(la2-la1)*0.3]);
    }
    if(this.routeLine) this.map.removeLayer(this.routeLine);
    if(this.routeGlow) this.map.removeLayer(this.routeGlow);
    this.routeGlow=L.polyline(pts,{color:'#14b8a6',weight:10,opacity:.2}).addTo(this.map);
    this.routeLine=L.polyline(pts,{color:'#14b8a6',weight:4,opacity:.9}).addTo(this.map);
    this.map.fitBounds(L.latLngBounds(pts).pad(0.3));
    this.drawRouteSvg(pts);
    document.getElementById('rEta').textContent = 'زمان تقریبی: --';
  },
  drawStraight(){
    const c=this.config, pts=[c.originLL,c.destLL];
    if(this.routeLine) this.map.removeLayer(this.routeLine);
    this.routeLine=L.polyline(pts,{color:'#14b8a6',weight:4,opacity:.9}).addTo(this.map);
    this.map.fitBounds(L.latLngBounds(pts).pad(0.3));
    this.drawRouteSvg(pts);
  },
  drawRouteSvg(latlngs){
    // نرمالایز به viewBox 600x80
    const lats=latlngs.map(p=>p[0]), lngs=latlngs.map(p=>p[1]);
    const mLa=Math.min(...lats), xLa=Math.max(...lats), mLn=Math.min(...lngs), xLn=Math.max(...lngs);
    const pad=12, W=600-2*pad, H=80-2*pad;
    const dx=(xLn-mLn)||1, dy=(xLa-mLa)||1;
    const sc=Math.min(W/dx, H/dy);
    const ox=pad+(W-dx*sc)/2, oy=pad+(H-dy*sc)/2;
    // معکوس کردن y چون SVG از بالا شروع می‌شه
    const pts=latlngs.map(p=>[ox+(p[1]-mLn)*sc, oy+(1-(p[0]-mLa)/dy)*dy*sc]);
    let dStr='M'+pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' L');
    // ساده‌سازی: هر ۵ نقطه یکی
    const simp=pts.filter((_,i)=>i%5===0||i===pts.length-1);
    dStr='M'+simp.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' L');
    document.getElementById('routePathBg').setAttribute('d',dStr);
    const fill=document.getElementById('routePathFill');
    fill.setAttribute('d',dStr);
    this._routeLen=fill.getTotalLength();
    this.updateRouteDot();
  },
  updateRouteDot(){
    const fill=document.getElementById('routePathFill');
    const dot=document.getElementById('routeDot');
    if(!fill||!this._routeLen) return;
    const len=this._routeLen*this.config.progress/100;
    fill.style.strokeDasharray=this._routeLen;
    fill.style.strokeDashoffset=this._routeLen-len;
    try{
      const pt=fill.getPointAtLength(len);
      dot.setAttribute('cx',pt.x); dot.setAttribute('cy',pt.y);
    }catch(e){}
  },
  drawMarkers(){
    const c=this.config;
    this.chargerMarkers.forEach(m=>this.map.removeLayer(m)); this.chargerMarkers=[];
    if(this._originM) this.map.removeLayer(this._originM);
    if(this._destM) this.map.removeLayer(this._destM);
    this._originM=L.circleMarker(c.originLL,{radius:6,color:'#fff',fillColor:'#14b8a6',fillOpacity:1,weight:2}).addTo(this.map);
    this._destM=L.circleMarker(c.destLL,{radius:6,color:'#fff',fillColor:'#ff5252',fillOpacity:1,weight:2}).addTo(this.map);
    c.chargers.forEach(ch=>{
      const m=L.circleMarker(ch.ll,{radius:5,color:'#fff',fillColor:'#ffd34d',fillOpacity:1,weight:2})
        .bindTooltip('⚡ '+ch.name).addTo(this.map);
      this.chargerMarkers.push(m);
    });
  },
  tick(){
    const now = new Date();
    document.getElementById('clock').textContent =
      FA_D(String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0'));
  }
};
/* ===== خواندن پارامتر از URL (اگر سایت پاس بده) ===== */
(function(){
  const q = new URLSearchParams(location.search);
  const cfg = {};
  if(q.get('origin')) cfg.origin = q.get('origin');
  if(q.get('destination')) cfg.destination = q.get('destination');
  if(q.get('olat') && q.get('olng')) cfg.originLL = [parseFloat(q.get('olat')), parseFloat(q.get('olng'))];
  if(q.get('dlat') && q.get('dlng')) cfg.destLL = [parseFloat(q.get('dlat')), parseFloat(q.get('dlng'))];
  if(q.get('speed')) cfg.speed = parseFloat(q.get('speed'));
  if(q.get('dist')) cfg.distanceKm = parseFloat(q.get('dist'));
  if(q.get('battery')) cfg.battery = parseFloat(q.get('battery'));
  if(q.get('temp')) cfg.temp = parseFloat(q.get('temp'));
  if(q.get('progress')) cfg.progress = parseFloat(q.get('progress'));
  window._urlCfg = cfg;
})();
/* ===== نمونه: سایت این‌طوری صدا می‌زنه ===== */
const _defaults = {
  origin:'تهران', destination:'چالوس', progress:35, speed:110, distanceKm:145,
  battery:68, temp:24, weatherDesc:'صاف و آفتابی', weatherIcon:'☀️',
  nextChargerKm:32, chargerPorts:4,
  originLL:[35.6892,51.3890], destLL:[36.6540,51.4210],
  chargers:[{name:'شارژر کرج', ll:[35.84,50.97]}, {name:'شارژر کندوان', ll:[36.10,51.30]}]
};
REVPreview.init(Object.assign({}, _defaults, window._urlCfg || {}));
/* نمونه قدیمی حذف شد */
</script>

<script>
// فالبک پخش ویدیو برای موبایل
(function(){
  var v = document.getElementById('bgvid');
  function tryPlay(){
    if(v && v.paused){
      var p = v.play();
      if(p) p.catch(function(){});
    }
  }
  ['touchstart','click','touchend'].forEach(function(ev){
    document.addEventListener(ev, tryPlay, {once:false, passive:true});
  });
  // تلاش اولیه
  tryPlay();
  setTimeout(tryPlay, 1000);
  setTimeout(tryPlay, 3000);
  // اگه ویدیو خطا داد، پوستر رو نگه دار
  v.addEventListener('error', function(){
    v.style.display = 'none';
    document.getElementById('stage').style.background =
      'url(https://mojtabaalimi64-cloud.github.io/rev/poster.jpg) center/cover no-repeat #000';
  });
})();
</script>

</body>
</html>
