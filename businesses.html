<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="فهرست تعمیرگاه‌ها و فروشگاه‌های قطعات در REV">
<title>فهرست مراکز خدمات و قطعات | REV</title>
<style>
:root{--bg:#080B0D;--panel:#121A1F;--paper:#F5F7F8;--line:#2A343A;--muted:#AAB6BC;--green:#39FF88;--teal:#00806F}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(150deg,#080B0D,#101d22);color:#f5f7f8;font:16px/1.9 Vazirmatn,Vazir,Tahoma,sans-serif}
a{color:var(--green)}.wrap{width:min(1100px,calc(100% - 28px));margin:auto}
header{padding:20px 0;border-bottom:1px solid #26343a}header .wrap{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.logo{font-size:28px;font-weight:900;letter-spacing:2px;color:var(--green)}.nav{display:flex;gap:12px;flex-wrap:wrap}.nav a{border:1px solid #35464d;border-radius:10px;padding:6px 12px;text-decoration:none}
main{padding:28px 0 60px}h1{font-size:clamp(25px,4vw,38px);line-height:1.5;margin:0 0 8px}h2{font-size:22px;margin:28px 0 14px}.muted{color:var(--muted);font-size:14px}.notice{border:1px solid #a57d35;background:#2a2112;padding:12px 16px;border-radius:12px;color:#ffdda0;margin:18px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}.card,.profile{background:linear-gradient(145deg,#152126,#10171b);border:1px solid #2b3b42;border-radius:16px;padding:18px}.card h3,.profile h2{margin:0 0 5px}.tag{display:inline-block;background:#24352d;border:1px solid #3e7558;color:#aaffca;border-radius:99px;padding:1px 10px;font-size:12px;margin:3px 0}.btn{display:inline-block;background:var(--green);color:#07100b;text-decoration:none;border-radius:9px;padding:7px 13px;font-weight:800;margin-top:10px}.profile{max-width:780px;margin:18px auto;padding:clamp(18px,4vw,32px)}.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin:18px 0}.fact{border:1px solid #2b3b42;border-radius:10px;padding:10px}.fact small{display:block;color:var(--muted)}.empty{padding:20px;border:1px dashed #46565c;border-radius:12px}
.profile-image{width:100%;height:180px;object-fit:cover;border-radius:10px;margin-bottom:10px;background:#172128}.profile-hero{display:block;width:100%;max-height:420px;object-fit:cover;border-radius:14px;margin:12px 0 20px;background:#172128}</style></head>
<body><header><div class="wrap"><div class="logo">REV</div><nav class="nav"><a href="./">صفحه اصلی</a><a href="./trip.html">برنامه‌ریز سفر</a><a href="./admin.html">پنل مدیریت</a></nav></div></header>
<main class="wrap"><div id="app"><p>در حال بارگذاری فهرست...</p></div></main>
<script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const params=new URLSearchParams(location.search), selected=params.get('id');
fetch('./content.json?v='+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('فهرست در دسترس نیست');return r.json()}).then(async d=>{
 const ratingMap=new Map();
 try{const rr=await fetch('https://rev-ratings-api.mojtaba-alimi64.workers.dev/api/ratings/overrides',{cache:'no-store'});const jj=await rr.json();if(rr.ok&&jj.success&&Array.isArray(jj.items))jj.items.forEach(x=>ratingMap.set(String(x.type)+'|'+String(x.id),x));}catch(e){console.warn('REV manual ratings unavailable',e)}
 const ratingFor=x=>ratingMap.get('store|'+String(x.id||((x.title||x.name||'فروشگاه')+'|'+(x.address||''))));
 const ratingLabel=x=>{const r=ratingFor(x);return r?'★ '+Number(r.average||0).toLocaleString('fa-IR',{maximumFractionDigits:1})+' از ۵ · '+Number(r.count||0).toLocaleString('fa-IR')+' رأی'+(Number(r.count||0)===0?' · امتیاز تنظیم‌شده مدیر':''):''};
 const all=[...(d.serviceCenters||[]).map(x=>({...x,kind:'تعمیرگاه مجاز',kindKey:'serviceCenters'})),...(d.partsStores||[]).map(x=>({...x,kind:'فروشگاه قطعات مجاز',kindKey:'partsStores'}))];
 const app=document.getElementById('app');
 const link=x=>'./businesses.html?id='+encodeURIComponent(x.profileSlug||x.id||'');
 const contact=x=>x.phone?'<a href="tel:'+encodeURIComponent(x.phone)+'">'+esc(x.phone)+'</a>':'درج نشده';
 const card=x=>'<article class="card">'+(x.image?'<img class="profile-image" src="'+esc(x.image)+'" alt="'+esc(x.title||x.name)+'" loading="lazy">':'')+'<span class="tag">'+esc(x.kind)+'</span> '+(x.testProfile?'<span class="tag">تست REV</span>':'')+'<h3>'+esc(x.title||x.name)+'</h3>'+(ratingFor(x)?'<p class="rating-display" style="font-weight:800;color:#39ff88">'+esc(ratingLabel(x))+'</p>':'')+'<p class="muted">'+esc(x.address||'نشانی ثبت نشده')+'</p><p>'+esc(x.description||x.notes||'اطلاعات تکمیلی ثبت نشده است.')+'</p><a class="btn" href="'+link(x)+'">مشاهده پروفایل</a></article>';
 if(selected){
  const x=all.find(x=>String(x.profileSlug||x.id)===selected);
  if(!x){app.innerHTML='<h1>پروفایل پیدا نشد</h1><p>ممکن است این مورد حذف یا شناسه آن تغییر کرده باشد.</p><a href="./businesses.html">بازگشت به فهرست</a>';return}
  app.innerHTML='<p><a href="./businesses.html">← بازگشت به فهرست مراکز</a></p><section class="profile">'+(x.image?'<img class="profile-hero" src="'+esc(x.image)+'" alt="'+esc(x.title||x.name)+'">':'')+'<span class="tag">'+esc(x.kind)+'</span> '+(x.testProfile?'<span class="tag">پروفایل آزمایشی REV</span>':'')+'<h1>'+esc(x.profileName||x.title||x.name)+'</h1><h2>'+esc(x.title||x.name)+'</h2><p class="muted">شناسه پروفایل: '+esc(x.profileSlug||x.id||'—')+'</p><div class="notice">'+(x.testProfile?'این پروفایل برای آزمایش امکانات REV ساخته شده است. وضعیت مجوز و اطلاعات تماس/موقعیت نیازمند بررسی مستقل است.':'اطلاعات این مرکز باید پیش از مراجعه بررسی شود.')+'</div><div class="facts"><div class="fact"><small>نشانی</small>'+esc(x.address||'درج نشده')+'</div><div class="fact"><small>تلفن</small>'+contact(x)+'</div><div class="fact"><small>وب‌سایت</small>'+(x.website?'<a target="_blank" rel="noopener" href="'+esc(x.website)+'">باز کردن وب‌سایت</a>':'درج نشده')+'</div><div class="fact"><small>وضعیت بررسی</small>'+esc(x.status==='verified'?'تأییدشده':x.status==='rejected'?'ردشده':'در انتظار بررسی')+'</div>'+(ratingFor(x)?'<div class="fact"><small>رضایت کاربران</small><strong style="color:#39ff88">'+esc(ratingLabel(x))+'</strong><small>امتیاز نهایی ثبت‌شده در سامانه REV</small></div>':'')+'<div class="fact"><small>برندها</small>'+esc(x.brands||'نیازمند تکمیل')+'</div><div class="fact"><small>مجوز/نمایندگی</small>'+esc(x.authorization||'نیازمند بررسی')+'</div></div><h2>خدمات و محصولات</h2><p>'+esc(x.services||x.products||'اطلاعات خدمات/محصولات ثبت نشده است.')+'</p><h2>توضیحات</h2><p>'+esc(x.description||x.notes||'توضیحات تکمیلی ثبت نشده است.')+'</p><p class="muted">ساعات کاری: '+esc(x.openingHours||'نیازمند تأیید')+'</p><a class="btn" href="https://www.openstreetmap.org/?mlat='+encodeURIComponent(x.latitude||'')+'&mlon='+encodeURIComponent(x.longitude||'')+'#map=16/'+encodeURIComponent(x.latitude||'')+'/'+encodeURIComponent(x.longitude||'')+'" target="_blank" rel="noopener">مشاهده موقعیت روی نقشه</a></section>';
 }else{
  const shops=all.filter(x=>x.kindKey==='partsStores'), repairs=all.filter(x=>x.kindKey==='serviceCenters');
  app.innerHTML='<h1>فهرست تعمیرگاه‌ها و فروشگاه‌های قطعات</h1><p class="muted">پروفایل‌ها از فهرست مدیریت REV خوانده می‌شوند.</p><div class="notice">پروفایل‌های «تست REV» برای آزمون فنی هستند و تأیید مجوز، نمایندگی یا کیفیت خدمات محسوب نمی‌شوند.</div><h2>تعمیرگاه‌های مجاز</h2><div class="grid">'+(repairs.map(card).join('')||'<div class="empty">تعمیرگاهی ثبت نشده است.</div>')+'</div><h2>فروشگاه‌های قطعات مجاز</h2><div class="grid">'+(shops.map(card).join('')||'<div class="empty">فروشگاهی ثبت نشده است.</div>')+'</div>';
 }
}).catch(e=>document.getElementById('app').innerHTML='<div class="empty">فهرست بارگذاری نشد: '+esc(e.message)+'</div>');
</script></body></html>
