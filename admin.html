<style>
:root{--ink:#080B0D;--ink-2:#121A1F;--paper:#F5F7F8;--line:#DDE3E6;--muted:#5B666D;--green:#39FF88;--teal-d:#00806F;
--font:"Vazirmatn","Vazir","IRANSansX","Segoe UI",Tahoma,system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--paper);color:var(--ink);line-height:1.8;font-size:16px}
button,input,select,textarea{font:inherit;color:inherit}
header{background:var(--ink);color:#fff;padding:14px 20px;font-weight:900;font-size:20px;display:flex;justify-content:space-between;align-items:center}
header b{color:var(--green)}header a{font-size:14px;font-weight:400;color:#C3CBD0}
.wrap{width:min(100% - 32px,860px);margin:24px auto 60px}
.bar2{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;position:sticky;top:0;background:var(--paper);padding:8px 0;z-index:5}
.tab{padding:6px 16px;border-radius:999px;border:1px solid var(--line);background:#fff;cursor:pointer}
.tab.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.pub{margin-inline-start:auto;background:var(--green);color:var(--ink);font-weight:700;border:0;border-radius:999px;padding:6px 22px;cursor:pointer}
.box{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:12px}
.box h3{margin-bottom:6px}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 16px;margin-bottom:8px}
.row small{color:var(--muted);display:block}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:2px 14px;cursor:pointer}
.btn.red{color:#B3261E}.btn.main{background:var(--ink);color:#fff;border-color:var(--ink)}
label{display:block;margin:12px 0 4px;font-weight:700;font-size:14px}
input[type=text],input[type=password],input[type=number],select,textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:#fff}
input[type=color]{width:64px;height:36px;border:1px solid var(--line);border-radius:8px;padding:2px;background:#fff;cursor:pointer}
#msg{min-height:26px;color:var(--teal-d);margin-bottom:8px}
.lnk{background:none;border:0;color:var(--muted);cursor:pointer;text-decoration:underline}
ol{padding-inline-start:20px;color:var(--muted);font-size:14px;margin-top:10px}
.tb{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px;align-items:center}
.imgf{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.imgf input{flex:1;min-width:180px}
.imgf img{max-height:90px;border-radius:8px;border:1px solid var(--line)}
.hint{color:var(--muted);font-size:13px}
:focus-visible{outline:3px solid var(--green);outline-offset:2px}
:root{--shadow:0 10px 30px rgba(8,11,13,.07);--radius:18px}
body{background:linear-gradient(180deg,#edf2f3 0,#f7f9fa 260px);font-size:15px}
header{position:sticky;top:0;z-index:20;padding:13px clamp(16px,3vw,34px);box-shadow:0 4px 18px rgba(0,0,0,.12);min-height:66px}
header>span{display:flex;align-items:center;gap:10px}header>span:first-letter{letter-spacing:1px}
.wrap{width:min(100% - 28px,1180px);margin:24px auto 64px}
.bar2{top:66px;background:rgba(247,249,250,.94);backdrop-filter:blur(12px);padding:12px;border:1px solid rgba(221,227,230,.85);border-radius:16px;box-shadow:var(--shadow)}
.tab{padding:8px 15px;transition:transform .15s,background .15s,border-color .15s}
.tab:hover,.btn:hover{transform:translateY(-1px);border-color:#8b9ba3}
.tab.on{box-shadow:0 5px 14px rgba(8,11,13,.16)}
.pub{padding:9px 20px;box-shadow:0 5px 15px rgba(57,255,136,.16);transition:transform .15s}
.pub:hover{transform:translateY(-1px)}
.box{border-color:#e2e8eb;border-radius:var(--radius);padding:clamp(16px,2.2vw,26px);margin-bottom:16px;box-shadow:var(--shadow)}
.box h2,.box h3{letter-spacing:-.2px}
.row{border-radius:14px;padding:13px 16px;transition:border-color .15s,box-shadow .15s}
.row:hover{border-color:#b5c3c9;box-shadow:0 5px 15px rgba(8,11,13,.04)}
.btn{padding:6px 13px;transition:all .15s}
.btn.main{background:linear-gradient(135deg,#10181d,#26353d)}
label{margin:14px 0 5px;color:#27343a}
input[type=text],input[type=password],input[type=number],select,textarea{padding:10px 13px;min-height:42px;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--teal-d);box-shadow:0 0 0 3px rgba(0,128,111,.10)}
textarea{min-height:110px;resize:vertical}
#msg{position:sticky;top:120px;z-index:4;background:#f7f9fa;padding:5px 0}
.hint{line-height:1.9}
@media(max-width:680px){header{font-size:17px}.wrap{width:min(100% - 18px,1180px);margin-top:12px}.bar2{top:60px;gap:6px}.tab{font-size:13px;padding:7px 10px}.pub{width:100%;margin-inline-start:0}.box{padding:15px}.row{align-items:flex-start;flex-wrap:wrap}}

/* REV dropdown visibility fix v2: force readable native select controls and popup options */
html body #root select,
html body #root select:focus,
html body #root select:hover {
  color: #142027 !important;
  background: #ffffff !important;
  -webkit-text-fill-color: #142027 !important;
  opacity: 1 !important;
  color-scheme: light !important;
  forced-color-adjust: none !important;
  appearance: auto !important;
  -webkit-appearance: menulist !important;
  text-shadow: none !important;
}
html body #root select option,
html body #root select optgroup,
html body #root select option:checked,
html body #root select option:hover {
  color: #142027 !important;
  background: #ffffff !important;
  -webkit-text-fill-color: #142027 !important;
  opacity: 1 !important;
  forced-color-adjust: none !important;
  text-shadow: none !important;
}
/* Keep selected options dark too: some native browser menus ignore option backgrounds. */
html body #root select option:checked {
  color: #142027 !important;
  background: #ffffff !important;
  -webkit-text-fill-color: #142027 !important;
}
html body #root select[data-t] {
  border: 1px solid #aebfc2 !important;
  font-weight: 600 !important;
}

function makeRevCode(prefix,id){
  const raw=String(id||'').replace(/[^a-zA-Z0-9]/g,'').toUpperCase();
  return 'REV-'+prefix+'-'+raw.slice(-8).padStart(8,'0');
}
function ensureBusinessIdentifiers(data){
  let changed=0;
  ['partsStores','serviceCenters'].forEach(k=>{
    if(!Array.isArray(data[k]))data[k]=[];
    const prefix=k==='serviceCenters'?'RP':'ST';
    data[k].forEach(item=>{
      if(!item.id){
        const uuid=(typeof crypto!=='undefined'&&crypto.randomUUID)?crypto.randomUUID():('legacy-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,10));
        item.id=k+'-'+uuid; changed++;
      }
      if(!item.publicCode){item.publicCode=makeRevCode(prefix,item.id);changed++;}
    });
    const used=new Set();
    data[k].forEach(item=>{
      if(used.has(item.publicCode)){
        item.publicCode='REV-'+prefix+'-'+String(item.id).replace(/[^a-zA-Z0-9]/g,'').slice(-12).toUpperCase();
      }
      used.add(item.publicCode);
    });
  });
  return changed;
}

    }
    else if(r.status===401||r.status===403){tok='';sessionStorage.removeItem('rev_admin_token');c=null;note='رمز مدیریتی پذیرفته نشد؛ دوباره وارد شوید.';draw()}

  }

/* Normalize Persian/Arabic letters and digits for all admin searches. */
function normalizeSearch(v){
  return String(v??'').toLocaleLowerCase()
    .replace(/[ي]/g,'ی').replace(/[ك]/g,'ک')
    .replace(/[٠-٩]/g,d=>String('٠١٢٣٤٥٦٧٨٩'.indexOf(d)))
    .replace(/[۰-۹]/g,d=>String('۰۱۲۳۴۵۶۷۸۹'.indexOf(d)))
    .replace(/[\s\-_.،,]/g,'');
}

async function loadRatings(){
  if(ratingsBusy)return;ratingsBusy=true;note='در حال دریافت سابقه فروشگاه‌ها، تعمیرگاه‌ها و ایستگاه‌های شارژ...';draw();
  try{
    const base='https://rev-ratings-api.mojtaba-alimi64.workers.dev/api/admin/ratings';
    const [storesRes,stationsRes]=await Promise.all([
      fetch(base+'?type=store&limit=1000',{headers:H(),cache:'no-store'}),
      fetch(base+'?type=station&limit=1000',{headers:H(),cache:'no-store'})
    ]);
    const [stores,stations]=await Promise.all([storesRes.json().catch(()=>({})),stationsRes.json().catch(()=>({}))]);
    if(!storesRes.ok||!stores.success)throw new Error(stores.error||('فروشگاه‌ها: HTTP '+storesRes.status));
    if(!stationsRes.ok||!stations.success)throw new Error(stations.error||('ایستگاه‌ها: HTTP '+stationsRes.status));
    ratingsCache=[
      ...(Array.isArray(stores.items)?stores.items.map(x=>({...x,_type:'store'})):[]),
      ...(Array.isArray(stations.items)?stations.items.map(x=>({...x,_type:'station'})):[])
    ];

function ratingTargets(){
  const out=[];
  (c?.partsStores||[]).forEach(x=>out.push({...x,_targetType:'store',_kind:'فروشگاه قطعات'}));
  (c?.serviceCenters||[]).forEach(x=>out.push({...x,_targetType:'store',_kind:'تعمیرگاه مجاز'}));
  (Array.isArray(stationsCache)?stationsCache:[]).forEach(x=>out.push({...x,_targetType:'station',_kind:'ایستگاه شارژ',title:x.name||x.title,id:String(x.id),address:x.address||x.location||'',phone:x.phone||''}));
  return out.map(x=>{
    const raw=String(x.id||((x.title||x.name||'پروفایل')+'|'+(x.address||''))).slice(0,240);
    const prefix=x._kind==='تعمیرگاه مجاز'?'RP':x._targetType==='station'?'CH':'ST';
    const suffix=raw.toUpperCase().replace(/[^A-Z0-9]/g,'').slice(-10).padStart(4,'0');
    return {...x,_targetId:raw,_publicCode:x.publicCode||('REV-'+prefix+'-'+suffix)};
  });
}
function ratingSearchResults(){
  const q=ratingSearchValue.trim().toLocaleLowerCase();
  if(!q)return [];
  const results=ratingTargets().filter(x=>[x._publicCode,x.id,x.title,x.name,x.address,x.phone,x._kind].some(v=>String(v||'').toLocaleLowerCase().includes(q)));
  if(ratingSortValue==='name')results.sort((a,b)=>String(a.title||a.name||'').localeCompare(String(b.title||b.name||''),'fa'));
  else if(ratingSortValue==='type')results.sort((a,b)=>String(a._kind||'').localeCompare(String(b._kind||''),'fa'));
  else if(ratingSortValue==='rating')results.sort((a,b)=>(Number(b.satisfactionScore)||0)-(Number(a.satisfactionScore)||0));
  else if(ratingSortValue==='votes')results.sort((a,b)=>(Number(b.satisfactionCount)||0)-(Number(a.satisfactionCount)||0));
  return results.slice(0,80);
}

async function loadStations(){
  if(stationBusy)return; stationBusy=true; note='در حال دریافت جایگاه‌ها از دیتابیس...'; draw();
  let lastError=null;
  try{
    for(const path of ['/api/admin/stations','/api/stations']){
      let timer=null;
      try{
        const controller=new AbortController();
        timer=setTimeout(()=>controller.abort(),8000);
        const r=await fetch(WORKER+path,{headers:H(),cache:'no-store',signal:controller.signal});
        clearTimeout(timer); timer=null;
        const j=await r.json().catch(()=>({}));
        if(!r.ok||!j.success)throw new Error((j.error||('HTTP '+r.status))+' ['+path+']');
        const rows=Array.isArray(j.data)?j.data:(Array.isArray(j.stations)?j.stations:null);
        if(!rows)throw new Error('پاسخ API فهرست جایگاه‌ها ندارد ['+path+']');
        stationsCache=rows;
        note=`${stationsCache.length} جایگاه از دیتابیس دریافت شد.`;
        lastError=null;
        break;
      }catch(err){
        if(timer!==null)clearTimeout(timer);
        lastError=err&&err.name==='AbortError'
          ? new Error('پاسخ سرور پس از ۸ ثانیه نرسید ['+path+']')
          : err;
      }
    }
    if(lastError)throw lastError;
  }catch(e){note='دریافت جایگاه‌ها ناموفق بود: '+(e.message||'خطای اتصال')+'؛ مسیر API جایگاه‌ها در Worker باید بررسی شود.';stationsCache=[]}
  finally{stationBusy=false;if(tab==='stations'||tab==='rating-admin')draw()}
}
function stationDate(s){
  const raw=s?.updated_at||s?.updatedAt||s?.last_updated||'';
  if(!raw)return {label:'ثبت به‌روزرسانی نشده',time:0,missing:true};
  const t=Date.parse(raw);
  if(!Number.isFinite(t))return {label:'تاریخ نامعتبر',time:0,missing:true};
  return {label:new Date(t).toLocaleString('fa-IR'),time:t,missing:false};
}
function stationIsStale(s){
  const d=stationDate(s);
  return d.missing || (Date.now()-d.time)>30*24*60*60*1000;
}
function stationDistanceKm(a,b){
  const rad=x=>x*Math.PI/180, dLat=rad(Number(b.latitude)-Number(a.latitude)), dLon=rad(Number(b.longitude)-Number(a.longitude));
  const x=Math.sin(dLat/2)**2+Math.cos(rad(Number(a.latitude)))*Math.cos(rad(Number(b.latitude)))*Math.sin(dLon/2)**2;
  return 6371*2*Math.asin(Math.min(1,Math.sqrt(x)));
}
function findStationDuplicates(s){
  if(!Array.isArray(stationsCache))return [];
  const sid=String(s.source_id||'').trim().toLowerCase(), src=String(s.source||'').trim().toLowerCase();
  return stationsCache.filter(x=>{
    if(s.id&&String(x.id)===String(s.id))return false;
    const xid=String(x.source_id||'').trim().toLowerCase(), xsrc=String(x.source||'').trim().toLowerCase();
    const sameSourceId=!!sid&&sid===xid&&(!src||!xsrc||src===xsrc);
    const validCoords=[s.latitude,s.longitude,x.latitude,x.longitude].every(v=>v!==''&&v!==null&&v!==undefined&&Number.isFinite(Number(v)));
    const closeCoords=validCoords&&Math.abs(Number(s.latitude))<=90&&Math.abs(Number(x.latitude))<=90&&Math.abs(Number(s.longitude))<=180&&Math.abs(Number(x.longitude))<=180&&stationDistanceKm(s,x)<=0.15;
    return sameSourceId||closeCoords;
  });
}

ی)')}<p class="hint" style="margin-top:8px">شناسه: ${esc(s.id||'پس از ثبت ساخته می‌شود')} · منبع: ${esc(s.source||'rev')}</p><p style="margin-top:16px"><button class="btn main" data-a="station-save">ذخیره جایگاه</button> <button class="btn" data-a="station-cancel">انصراف</button></p></div>`;
}
function stationFormValues(){
  const val=k=>document.getElementById('st_'+k)?.value.trim()||'';
  const s={name:val('name'),image_url:val('image'),address:val('address'),latitude:Number(val('latitude')),longitude:Number(val('longitude')),power_kw:val('power_kw')===''?null:Number(val('power_kw')),satisfactionScore:val('satisfactionScore')===''?null:Number(val('satisfactionScore')),satisfactionCount:val('satisfactionCount')===''?0:Math.max(0,parseInt(val('satisfactionCount'),10)||0),satisfactionNote:val('satisfactionNote'),connectors:val('connectors').split(/[,،;|]/).map(x=>x.trim()).filter(Boolean),status:val('status')||'unknown',source_url:val('source_url'),source_id:val('source_id'),openingHours:val('openingHours'),source:stationEdit.item?.source||'rev'};
  if(stationEdit.item?.id)s.id=stationEdit.item.id; return s;
}
function parseCSV(text){
  const rows=[];let row=[],cell='',quoted=false;const firstLine=text.split(/\r?\n/,1)[0]||'';const delimiter=firstLine.includes(',')?',':firstLine.includes(';')?';':'\t';
  for(let i=0;i<text.length;i++){const ch=text[i];if(ch==='"'&&quoted&&text[i+1]==='"'){cell+='"';i++}else if(ch==='"'){quoted=!quoted}else if(ch===delimiter&&!quoted){row.push(cell.trim());cell=''}else if((ch==='\n'||ch==='\r')&&!quoted){if(ch==='\r'&&text[i+1]==='\n')i++;row.push(cell.trim());if(row.some(Boolean))rows.push(row);row=[];cell=''}else cell+=ch}
  row.push(cell.trim());if(row.some(Boolean))rows.push(row);if(rows.length<2)throw new Error('فایل باید یک ردیف عنوان و دست‌کم یک ردیف داده داشته باشد.');
  const keyMap={name:['name','title','station_name','نام','نام جایگاه'],address:['address','آدرس'],latitude:['latitude','lat','عرض جغرافیایی','عرض'],longitude:['longitude','lon','lng','طول جغرافیایی','طول'],connectors:['connectors','connector_types','کانکتورها','کانکتور'],power_kw:['power_kw','power','توان','توان شارژ'],status:['status','وضعیت'],source_url:['source_url','url','لینک','لینک منبع'],source_id:['source_id','شناسه منبع'],id:['id','شناسه'],source:['source','منبع']};
  const headers=rows[0].map(h=>h.trim().toLowerCase());const idx={};for(const [k,aliases] of Object.entries(keyMap)){idx[k]=headers.findIndex(h=>aliases.includes(h))}
  if(idx.name<0||idx.latitude<0||idx.longitude<0)throw new Error('ستون‌های name، latitude و longitude الزامی‌اند.');
  return rows.slice(1).map(r=>{const o={};for(const k of Object.keys(keyMap)){if(idx[k]>=0)o[k]=r[idx[k]]??''}if(o.connectors)o.connectors=o.connectors.split(/[,،;|]/).map(x=>x.trim()).filter(Boolean);if(o.power_kw==='')o.power_kw=null;if(o.latitude!=='')o.latitude=Number(o.latitude);if(o.longitude!=='')o.longitude=Number(o.longitude);if(o.power_kw!==null&&o.power_kw!==undefined)o.power_kw=Number(o.power_kw);o.source=o.source||'rev';o.status=o.status||'unknown';return o}).filter(o=>o.name||o.latitude||o.longitude);
}
function downloadStationTemplate(){
  const csv='name,address,latitude,longitude,connectors,power_kw,status,openingHours,source_url,source_id\n';
  const blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8;'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='rev-stations-template.csv';a.click();URL.revokeObjectURL(a.href);
}
/* ---- رویدادها ---- */
function wrap(a,b,ph){const el=$('f_body'),s=el.selectionStart,e=el.selectionEnd;el.setRangeText(a+(el.value.slice(s,e)||ph)+b,s,e,'end');el.focus()}
function collect(){
  const it={...edit.item};
  document.querySelectorAll('[data-f]').forEach(el=>{const f=el.dataset.f;it[f]=f==='body'?el.value.split(/\n\s*\n/).map(x=>x.trim()).filter(Boolean):el.value.trim()});
  return it;
}
root.addEventListener('input',e=>{
  const t=e.target,d=t.dataset;
  if('usersSearch' in d){usersSearchValue=t.value;usersPage=1;clearTimeout(usersDebounce);usersDebounce=setTimeout(()=>{usersBusy=false;loadUsers()},300);return}
  if('stationSearch' in d){stationSearchValue=t.value;const pos=t.selectionStart;draw();const input=$('station-search');if(input){input.focus();try{input.setSelectionRange(pos,pos)}catch(_){}}return}
  if('listSearch' in d){listSearchValue=t.value;const q=normalizeSearch(listSearchValue.trim());let n=0;root.querySelectorAll('.admin-list-row').forEach(row=>{const show=!q||normalizeSearch(row.dataset.search||'').includes(q);row.hidden=!show;if(show)n++});const counter=$('list-count');if(counter)counter.textContent=n;return}
  if('ratingSearch' in d){ratingSearchValue=t.value;ratingSelected=null;ratingOverride=null;const pos=t.selectionStart;draw();const input=$('rating-search');if(input){input.focus();try{input.setSelectionRange(pos,pos)}catch(_){}}return}
  if(d.t){c.theme[d.t]=t.type==='number'?+t.value:t.value;dirty=true;if(['adminSize','tableSize','tableDensity','tableLines','tableStripe','tableWidth'].includes(d.t))applyAdminAppearance()}
  else if(d.c){c.contact[d.c]=t.value.trim();dirty=true}
  else if(d.s){c.shopInfo[d.s]=t.value;dirty=true}
  else if(d.ci){c.carsInfo[d.ci]=t.value;dirty=true}
  else if(t.id==='ab'){c.about=t.value;dirty=true}
  else if(d.g){c.gaId=t.value.trim();dirty=true}
  else if(t.id==='pn'){c.podcast=t.value;dirty=true}
});
root.addEventListener('change',e=>{
  if(e.target.id==='sh'){c.shop=e.target.checked;dirty=true}
  if(e.target.id==='tc')wrap('{'+e.target.value+'|','}','متن رنگی');
  if(e.target.dataset.listSort){listSortValue=e.target.value;draw()}
  if(e.target.dataset.stationSort){stationSortValue=e.target.value;draw()}
  if(e.target.dataset.usersSort){usersSortValue=e.target.value;usersPage=1;loadUsers()}
  if(e.target.dataset.usersOrder){usersOrder=e.target.value;usersPage=1;loadUsers()}
  if(e.target.dataset.ratingSort){ratingSortValue=e.target.value;draw()}
});
root.addEventListener('change',async e=>{
  if(e.target.id==='station-csv'&&e.target.files?.[0]){const file=e.target.files[0];try{const text=await file.text();const rows=parseCSV(text);if(!rows.length){msg('هیچ ردیف معتبری در فایل پیدا نشد.');return}if(!confirm(`${rows.length} ردیف برای ورود آماده است. موارد هم‌مختصات/هم‌شناسه به‌روزرسانی می‌شوند. ادامه می‌دهید؟`))return;msg('در حال ورود گروهی...');const r=await fetch(WORKER+'/api/admin/stations/bulk',{method:'POST',headers:H(),body:JSON.stringify({stations:rows})});const j=await r.json().catch(()=>({}));if(!r.ok||!j.success)throw new Error(j.error||('HTTP '+r.status));stationsCache=null;note=`ورود گروهی موفق بود؛ ${j.count} ردیف پردازش شد.`;await loadStations()}catch(err){msg('ورود CSV ناموفق بود: '+(err.message||'خطای فایل'))}finally{e.target.value=''}}
});

root.addEventListener('click',async e=>{
  const b=e.target.closest('[data-a]'); if(!b) return;
  const a=b.dataset.a, i=+b.dataset.i;
  if(a==='login'){tok=$('t').value.trim();gitTok=$('gt').value.trim();if(!tok){msg('رمز مدیریتی را وارد کنید.');return}sessionStorage.setItem('rev_admin_token',tok);if(gitTok)sessionStorage.setItem('rev_github_token',gitTok);else sessionStorage.removeItem('rev_github_token');c=null;draw()}
  else if(a==='out'){sessionStorage.removeItem('rev_admin_token');sessionStorage.removeItem('rev_github_token');tok='';gitTok='';c=null;note='';draw()}
  else if(a==='tab'){tab=b.dataset.k;edit=null;stationEdit=null;note='';draw();if(tab==='stations'||tab==='rating-admin')loadStations();if(tab==='ratings'||tab==='serviceCenters'||tab==='partsStores'||tab==='stations')loadRatings();if(tab==='station-reports')loadStationReports();if(tab==='set')loadAuthSettings();if(tab==='users')loadUsers()}
  else if(a==='users-prev'){usersPage=Math.max(1,usersPage-1);loadUsers()}
  else if(a==='users-next'){usersPage++;loadUsers()}
  else if(a==='new'){edit={i:-1,item:tab==='products'?{stock:'in'}:tab==='cars'?{}:(tab==='serviceCenters'||tab==='partsStores')?{status:'pending'}:tab==='ads'?{position:'left',enabled:'yes',order:'10'}:tab==='techSections'?{part:'battery',enabled:'yes',order:'10'}:{part:'battery'}};draw()}
  else if(a==='verify-toggle'){
    const k=b.dataset.k, idx=Number(b.dataset.i);
    if(!['serviceCenters','partsStores'].includes(k)||!c[k]?.[idx])return;
    const checked=b.checked;
    c[k][idx].status=checked?'verified':'pending';
    c[k][idx].reviewedAt=checked?new Date().toISOString():'';
    c[k][idx].reviewedBy='REV admin';
    dirty=true;
    draw();
    await save();
  }
  else if(a==='edit'){edit={i,item:{...c[tab][i]}};draw()}
  else if(a==='del'){if(confirm('این مورد حذف شود؟')){c[tab].splice(i,1);dirty=true;draw()}}
  else if(a==='cancel'){edit=null;draw()}
  else if(a==='reset'){c.theme={...THEME0,adminSize:13,tableSize:11,tableDensity:'compact',tableLines:'full',tableStripe:'yes',tableWidth:'scroll'};dirty=true;draw()}
  else if(a==='reset-layout'){Object.assign(c.theme,{adminSize:13,tableSize:11,tableDensity:'compact',tableLines:'full',tableStripe:'yes',tableWidth:'scroll'});dirty=true;draw()}
  else if(a==='up'||a==='clr'){
    const id=b.dataset.id, inp=$(id), im=$('p_'+id);
    let p=''; if(a==='up'){p=await upImage(); if(!p)return}
    inp.value=p; im.hidden=!p; if(p)im.src=prev[p];
    if(inp.dataset.pi){c.partImages[inp.dataset.pi]=p;if(!p)delete c.partImages[inp.dataset.pi];dirty=true}
  }
  else if(a==='fmt'){
    const w=b.dataset.w;
    if(w==='b')wrap('**','**','متن پررنگ');
    else if(w==='mark')wrap('==','==','متن مهم');
    else if(w==='h')wrap('\n\n## ','\n\n','عنوان فرعی');
    else if(w==='link'){const u=prompt('آدرس لینک (با https:// شروع شود):');if(u)wrap('[','](' +u.trim()+')','متن لینک')}
    else if(w==='img'){const p=await upImage();if(p)wrap('\n\n![توضیح تصویر](' +p+')\n\n','','')}
  }
  else if(a==='ok'){
    const it=collect();
    if(!it.title){msg('عنوان لازم است.');return}
    if(tab==='serviceCenters'||tab==='partsStores'){
      const lat=Number(it.latitude),lon=Number(it.longitude);
      if(it.latitude!==''||it.longitude!=='')if(!Number.isFinite(lat)||lat < -90||lat > 90||!Number.isFinite(lon)||lon < -180||lon > 180){msg('مختصات باید معتبر باشد؛ برای نمایش روی نقشه هر دو مختصات را وارد کنید.');return}
      it.category=tab==='serviceCenters'?'authorized_ev_service':'ev_parts_store';it.latitude=it.latitude===''?'':lat;it.longitude=it.longitude===''?'':lon;it.id=it.id||tab+'-'+Date.now().toString(36);if(!it.publicCode){const prefix=tab==='serviceCenters'?'RP':'ST';const suffix=String(it.id).toUpperCase().replace(/[^A-Z0-9]/g,'').slice(-10).padStart(4,'0');it.publicCode='REV-'+prefix+'-'+suffix;}
    }
    if(tab==='articles'&&!it.slug)it.slug='a'+Date.now().toString(36);
    if(edit.i<0)c[tab].unshift(it);else c[tab][edit.i]=it;
    edit=null;dirty=true;draw();
  }
  else if(a==='ratings-filter'){ratingHistoryFilter=['all','store','station'].includes(b.dataset.k)?b.dataset.k:'all';draw()}
  else if(a==='ratings-refresh'){ratingsCache=null;loadRatings()}
  else if(a==='rating-search'){ratingSearchValue=$('rating-search')?.value||ratingSearchValue;ratingSelected=null;ratingOverride=null;draw()}
  else if(a==='rating-clear'){ratingSearchValue='';ratingSelected=null;ratingOverride=null;draw()}
  else if(a==='rating-select'){const target=ratingSearchResults()[i];if(target)await selectRatingTarget(target)}
  else if(a==='rating-save'){await saveManualRating()}
  else if(a==='rating-sms'){
    if(!ratingSelected){msg('ابتدا یک پروفایل را انتخاب کنید.');return}
    const phone=$('rating-phone')?.value.trim()||'';
    const publicCode=$('rating-code')?.value.trim()||ratingSelected._publicCode;
    const displayName=$('rating-name')?.value.trim()||ratingSelected.title||ratingSelected.name||'صاحب کسب‌وکار';
    if(!confirm('شناسه '+publicCode+' به شماره '+phone+' پیامک شود؟'))return;
    msg('در حال ارسال شناسه با ملی پیامک...');
    try{
      const r=await fetch(AUTH_WORKER+'/api/admin/send-owner-code',{method:'POST',headers:H(),body:JSON.stringify({phone,publicCode,displayName})});
      const j=await r.json().catch(()=>({}));
      if(!r.ok||!j.success)throw new Error(j.error||('HTTP '+r.status));
      msg('درخواست ارسال پیامک ثبت شد.');
    }catch(err){msg('ارسال پیامک انجام نشد: '+(err.message||'تنظیمات ملی پیامک را بررسی کنید.'))}
  }
  else if(a==='station-reports-refresh'){stationReportsCache=null;loadStationReports()}
  else if(a==='station-report-status'){
    const id=Number(b.dataset.id),status=b.dataset.status;
    if(!Number.isSafeInteger(id)||!['new','in_review','published','resolved','invalid'].includes(status)){msg('شناسه یا وضعیت گزارش نامعتبر است.');return}
    const report=(stationReportsCache||[]).find(x=>Number(x.id)===id),adminNote=prompt('یادداشت مدیر (اختیاری):',report?.admin_note||'');
    if(adminNote===null)return;
    try{const r=await fetch(RATING_WORKER+'/api/admin/station-reports/'+id,{method:'PUT',headers:H(),body:JSON.stringify({status,admin_note:adminNote})});const j=await r.json().catch(()=>({}));if(!r.ok||!j.success)throw new Error(j.error||('HTTP '+r.status));stationReportsCache=null;msg(j.message||'وضعیت گزارش ذخیره شد.');await loadStationReports()}
    catch(err){msg('ذخیره وضعیت گزارش ناموفق بود: '+(err.message||'خطای اتصال'))}
  }
  else if(a==='station-refresh'){stationsCache=null;loadStations()}
  else if(a==='station-new'){stationEdit={isNew:true,item:{source:'rev',status:'unknown'}};draw()}
  else if(a==='station-review'){
    const s=stationsCache[i], status=b.dataset.status;
    if(!s?.id||!['pending','approved','rejected'].includes(status)){msg('شناسه یا وضعیت بررسی معتبر نیست.');return}
    const actionLabel=status==='approved'?'تأیید و انتشار':status==='rejected'?'رد جایگاه':'بازگردانی به بررسی';
    if(!confirm(`آیا می‌خواهید جایگاه «${s.name||'بدون نام'}» را ${actionLabel} کنید؟`))return;
    try{const r=await fetch(WORKER+'/api/admin/stations/'+encodeURIComponent(s.id)+'/review',{method:'POST',headers:H(),body:JSON.stringify({approval_status:status,review_note:status==='rejected'?'ردشده توسط مدیر':''})});const j=await r.json().catch(()=>({}));if(!r.ok||!j.success)throw new Error(j.error||('HTTP '+r.status));stationsCache=null;note=j.message||'وضعیت بررسی ذخیره شد.';await loadStations()}catch(err){msg('ثبت نتیجه بررسی ناموفق بود: '+(err.message||'خطای اتصال'))}
  }
  else if(a==='station-edit'){stationEdit={isNew:false,item:{...stationsCache[i]}};draw()}
  else if(a==='station-cancel'){stationEdit=null;draw()}
  else if(a==='station-save'){
    const s=stationFormValues();
    if(!s.name){msg('نام جایگاه الزامی است.');return}
    if(!Number.isFinite(s.latitude)||s.latitude < -90||s.latitude > 90||!Number.isFinite(s.longitude)||s.longitude < -180||s.longitude > 180){msg('مختصات جغرافیایی معتبر وارد کنید.');return}
    if(s.power_kw!==null&&(!Number.isFinite(s.power_kw)||s.power_kw<0)){msg('توان شارژ باید عدد مثبت یا خالی باشد.');return}
    const duplicates=findStationDuplicates(s);
    if(duplicates.length){
      const names=duplicates.slice(0,4).map(x=>x.name||'بدون نام').join('، ');
      const more=duplicates.length>4?' و '+(duplicates.length-4)+' مورد دیگر':'';
      if(!confirm('احتمال ثبت تکراری وجود دارد. جایگاه نزدیک یا دارای شناسه منبع یکسان: '+names+more+' .\nفاصله مختصات تا ۱۵۰ متر یا شناسه منبع یکسان است. با وجود این هشدار ادامه می‌دهید؟'))return;
    }
    try{const isNew=stationEdit.isNew;const endpoint=isNew?WORKER+'/api/admin/stations':WORKER+'/api/admin/stations/'+encodeURIComponent(s.id);const r=await fetch(endpoint,{method:isNew?'POST':'PUT',headers:H(),body:JSON.stringify(s)});const j=await r.json().catch(()=>({}));if(!r.ok||!j.success)throw new Error(j.error||('HTTP '+r.status));stationEdit=null;stationsCache=null;note=j.message||'ذخیره شد.';await loadStations()}catch(e){msg('ذخیره جایگاه انجام نشد: '+(e.message||'خطای اتصال'))}
  }
  else if(a==='station-delete'){const s=stationsCache[i];if(s&&confirm('جایگاه «'+s.name+'» حذف شود؟')){try{const r=await fetch(WORKER+'/api/admin/stations/'+encodeURIComponent(s.id),{method:'DELETE',headers:H()});const j=await r.json().catch(()=>({}));if(!r.ok||!j.success)throw new Error(j.error||('HTTP '+r.status));stationsCache=null;note='جایگاه حذف شد.';await loadStations()}catch(e){msg('حذف انجام نشد: '+(e.message||'خطای اتصال'))}}}
  else if(a==='station-import')$('station-csv').click()
  else if(a==='station-template')downloadStationTemplate()
  else if(a==='auth-save')saveAuthSettings();
  else if(a==='pub')save();
});
draw();
