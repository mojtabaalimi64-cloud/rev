<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>پنل مدیریت REV</title>
<style>
:root{--ink:#080B0D;--ink-2:#121A1F;--paper:#F5F7F8;--line:#DDE3E6;--muted:#5B666D;--green:#39FF88;--teal-d:#00806F;
--font:"Vazirmatn","Vazir","IRANSansX","Segoe UI",Tahoma,system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--paper);color:var(--ink);line-height:1.8;font-size:16px}
button,input,select,textarea{font:inherit;color:inherit}
header{background:var(--ink);color:#fff;padding:14px 20px;font-weight:900;font-size:20px;display:flex;justify-content:space-between;align-items:center}
header b{color:var(--green)}header a{font-size:14px;font-weight:400;color:#C3CBD0}
.wrap{width:min(100% - 32px,860px);margin:24px auto 60px}
.bar2{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;position:sticky;top:0;background:var(--paper);padding:8px 0;z-index:5}
.tab{padding:6px 16px;border-radius:999px;border:1px solid var(--line);background:#fff;cursor:pointer}
.tab.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.pub{margin-inline-start:auto;background:var(--green);color:var(--ink);font-weight:700;border:0;border-radius:999px;padding:6px 22px;cursor:pointer}
.box{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:12px}
.box h3{margin-bottom:6px}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 16px;margin-bottom:8px}
.row small{color:var(--muted);display:block}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:2px 14px;cursor:pointer}
.btn.red{color:#B3261E}.btn.main{background:var(--ink);color:#fff;border-color:var(--ink)}
label{display:block;margin:12px 0 4px;font-weight:700;font-size:14px}
input[type=text],input[type=password],input[type=number],select,textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:#fff}
input[type=color]{width:64px;height:36px;border:1px solid var(--line);border-radius:8px;padding:2px;background:#fff;cursor:pointer}
#msg{min-height:26px;color:var(--teal-d);margin-bottom:8px}
.lnk{background:none;border:0;color:var(--muted);cursor:pointer;text-decoration:underline}
ol{padding-inline-start:20px;color:var(--muted);font-size:14px;margin-top:10px}
.tb{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px;align-items:center}
.imgf{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.imgf input{flex:1;min-width:180px}
.imgf img{max-height:90px;border-radius:8px;border:1px solid var(--line)}
.hint{color:var(--muted);font-size:13px}
:focus-visible{outline:3px solid var(--green);outline-offset:2px}
</style>
</head>
<body>
<header><span>REV <b>پنل مدیریت</b></span><a href="./">مشاهده سایت ←</a></header>
<div class="wrap" id="root"></div>
<script>
const OWNER='mojtabaalimi64-cloud', REPO='rev', FILE='content.json';
const API=`https://api.github.com/repos/${OWNER}/${REPO}/contents/`;
const WORKER='https://rev-api.mojtaba-alimi64.workers.dev';
const AUTH_WORKER='https://rev-auth-api.mojtaba-alimi64.workers.dev';
const LIVE_CONTENT='https://mojtabaalimi64-cloud.github.io/rev/content.json';
const PARTS={battery:'باتری',motor:'موتور',charging:'شارژ',electronics:'اینورتر و برق',software:'نرم‌افزار و هوش مصنوعی'};
const TYPES={
 articles:{label:'مقالات',one:'مقاله',fields:[['title','عنوان','text'],['part','بخش','part'],['date','تاریخ (مثلاً ۱۴۰۵/۰۷/۲۰)','text'],['image','تصویر شاخص مقاله','img'],['excerpt','خلاصه کوتاه','area'],['body','متن کامل','body']]},
 news:{label:'اخبار',one:'خبر',fields:[['title','عنوان خبر','text'],['part','بخش','part'],['date','تاریخ','text'],['url','لینک خبر (اختیاری)','text']]},
 episodes:{label:'پادکست',one:'قسمت',fields:[['title','عنوان قسمت','text'],['date','تاریخ','text'],['image','تصویر قسمت','img'],['url','لینک شنیدن','text'],['desc','توضیح','area']]}
 ,products:{label:'فروشگاه',one:'محصول',fields:[['title','نام محصول','text'],['price','قیمت (فقط عدد، مثلاً 1500000)','text'],['image','تصویر محصول','img'],['desc','توضیحات کوتاه','area'],['url','لینک سفارش همین محصول (اختیاری)','text'],['stock','موجودی','stock']]}
 ,cars:{label:'خودروها',one:'خودرو',fields:[['title','نام خودرو (برند و مدل)','text'],['type','نوع بدنه','sel:sedan|سدان,suv|شاسی‌بلند,hatch|هاچ‌بک,crossover|کراس‌اور,other|سایر'],['market','وضعیت در بازار ایران','sel:iran|موجود در بازار ایران,import|وارداتی یا غیررسمی,none|فعلاً در بازار ایران نیست'],['price','قیمت به تومان (عدد کامل، مثلاً 2500000000)','text'],['priceDate','تاریخ قیمت (مثلاً ۱۴۰۵/۰۷/۲۰)','text'],['range','برد (کیلومتر، فقط عدد)','text'],['rangeStd','استاندارد اندازه‌گیری برد (WLTP، EPA، CLTC و...)','text'],['battery','ظرفیت باتری (کیلووات‌ساعت، فقط عدد)','text'],['power','توان (اسب‌بخار، فقط عدد)','text'],['accel','شتاب ۰ تا ۱۰۰ (ثانیه، فقط عدد)','text'],['dc','حداکثر شارژ DC (کیلووات، فقط عدد)','text'],['seats','تعداد صندلی (فقط عدد)','text'],['drive','سیستم محرک','sel:RWD|عقب‌رو,FWD|جلو‌رو,AWD|چهارچرخ‌محرک'],['connector','نوع کانکتور شارژ (مثلاً CCS2)','text'],['image','تصویر خودرو','img'],['pros','نقاط قوت (هر مورد در یک خط)','area'],['cons','نقاط ضعف (هر مورد در یک خط)','area'],['url','لینک بررسی کامل یا خرید (اختیاری)','text']]}
 ,serviceCenters:{label:'تعمیرگاه‌های مجاز خودرو برقی',one:'تعمیرگاه',fields:[['title','نام تعمیرگاه','text'],['address','نشانی کامل','area'],['latitude','عرض جغرافیایی (Latitude)','text'],['longitude','طول جغرافیایی (Longitude)','text'],['phone','شماره تماس','text'],['website','وب‌سایت یا صفحه رزرو','text'],['brands','برندهای تحت پوشش (با ویرگول جدا کنید)','text'],['services','خدمات (مثلاً عیب‌یابی، باتری، موتور، اینورتر، نرم‌افزار)','area'],['authorization','مرجع/مدرک مجوز و شماره آن','text'],['status','وضعیت بررسی','sel:pending|در انتظار بررسی,verified|تأییدشده,rejected|ردشده'],['openingHours','ساعات کاری (مثلاً شنبه تا چهارشنبه ۹ تا ۱۸؛ پنجشنبه ۹ تا ۱۳)','area'],['description','توضیحات تکمیلی','area']]}
 ,partsStores:{label:'فروشگاه‌های قطعات خودرو برقی',one:'فروشگاه قطعات',fields:[['title','نام فروشگاه','text'],['address','نشانی کامل','area'],['latitude','عرض جغرافیایی (Latitude)','text'],['longitude','طول جغرافیایی (Longitude)','text'],['phone','شماره تماس','text'],['website','وب‌سایت یا لینک سفارش','text'],['brands','برندها و مدل‌های سازگار (با ویرگول جدا کنید)','text'],['products','دسته‌های قطعات (باتری، شارژر، اینورتر، موتور، کابل و...)','area'],['authorization','مرجع/مدرک نمایندگی یا مجوز','text'],['status','وضعیت بررسی','sel:pending|در انتظار بررسی,verified|تأییدشده,rejected|ردشده'],['openingHours','ساعات کاری فروشگاه (روزها و بازه زمانی)','area'],['deliveryHours','ساعات ارسال/تحویل (اختیاری)','area'],['description','توضیحات تکمیلی','area']]}
};
const TABS={...Object.fromEntries(Object.entries(TYPES).map(([k,t])=>[k,t.label])),stations:'جایگاه‌های شارژ',serviceCenters:'تعمیرگاه‌های مجاز',partsStores:'فروشگاه‌های قطعات',about:'درباره ما',look:'ظاهر سایت',contact:'ارتباط با ما',set:'تنظیمات'};
let stationsCache=null, stationEdit=null, stationBusy=false;
const FONTS={modern:'مدرن (وزیرمتن)',classic:'کلاسیک (تاهوما)',serif:'رسمی (سریف)'};
const THEME0={accent:'#39FF88',dark:'#080B0D',paper:'#F5F7F8',text:'#080B0D',font:'modern',size:17};
const CONTACT=[['email','ایمیل'],['phone','تلفن'],['telegram','تلگرام (نام کاربری یا لینک)'],['instagram','اینستاگرام (نام کاربری یا لینک)'],['youtube','یوتیوب (لینک کامل)'],['x','ایکس (نام کاربری یا لینک)'],['address','آدرس'],['note','متن کوتاه پایین صفحه‌ی تماس']];
let tok=sessionStorage.getItem('rev_admin_token')||'', gitTok=sessionStorage.getItem('rev_github_token')||'', c=null, sha='', tab='articles', edit=null, dirty=false, note='', prev={};
const root=document.getElementById('root'), $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const H=()=>({Authorization:'Bearer '+tok,Accept:'application/json','Content-Type':'application/json'});
const api=(m,b)=>fetch(WORKER+'/api/admin/content',{method:m,headers:H(),body:b===undefined?undefined:JSON.stringify(b)});
const GH=()=>({Authorization:'Bearer '+gitTok,Accept:'application/vnd.github+json'});
function msg(t){note=t;const e=$('msg');if(e)e.textContent=t}

async function load(){
  msg('در حال بارگذاری اطلاعات...');
  try{
    const r=await api('GET');
    if(r.status===401||r.status===403){tok='';sessionStorage.removeItem('rev_admin_token');note='رمز مدیریتی Cloudflare نادرست است.';return draw()}
    if(!r.ok) throw new Error('API '+r.status);
    const j=await r.json();
    if(j.success && j.data && typeof j.data==='object'){
      c=j.data;
      note='اطلاعات از دیتابیس Cloudflare بارگذاری شد.';
    }else{
      // First-time migration: seed the editor from the current public content.json.
      const old=await fetch(LIVE_CONTENT+'?v='+Date.now(),{cache:'no-store'});
      if(!old.ok) throw new Error('Could not load existing content.json');
      c=await old.json();
      note='اطلاعات از نسخه فعلی سایت بارگذاری شد. برای انتقال آن به دیتابیس، پس از بررسی روی «انتشار تغییرات» بزنید.';
    }
    c.theme={...THEME0,...(c.theme||{})};c.contact=c.contact||{};c.partImages=c.partImages||{};c.podcast=c.podcast||'REV Podcast';c.shopInfo=c.shopInfo||{};c.carsInfo=c.carsInfo||{};c.about=c.about||'';
    ['news','articles','episodes','products','cars','serviceCenters','partsStores'].forEach(k=>c[k]=c[k]||[]);
    draw();
  }catch(e){msg('بارگذاری انجام نشد. اتصال Worker و نشانی content.json را بررسی کنید.');}
}
async function save(){
  msg('در حال ذخیره در دیتابیس Cloudflare...');
  try{
    const r=await api('PUT',c);
    const j=await r.json().catch(()=>({}));
    if(r.ok&&j.success){
      dirty=false;
      if(gitTok){
        try{
          msg('داده‌ها ذخیره شد؛ در حال انتشار نسخه عمومی برای نمایش روی نقشه...');
          const current=await fetch(API+FILE,{headers:GH(),cache:'no-store'});
          const currentJson=await current.json().catch(()=>({}));
          if(!current.ok||!currentJson.sha)throw new Error('خواندن نسخه فعلی content.json ناموفق بود');
          const encoded=btoa(unescape(encodeURIComponent(JSON.stringify(c,null,2)+'\n')));
          const put=await fetch(API+FILE,{method:'PUT',headers:GH(),body:JSON.stringify({message:'Publish REV content and EV business directories',content:encoded,sha:currentJson.sha})});
          const putJson=await put.json().catch(()=>({}));
          if(!put.ok)throw new Error(putJson.message||('GitHub HTTP '+put.status));
          draw();msg('ذخیره در Cloudflare و انتشار content.json در GitHub انجام شد. داده‌های تأییدشده در فهرست عمومی برای نقشه قابل خواندن هستند.');
        }catch(pubErr){draw();msg('داده‌ها در Cloudflare ذخیره شد، اما انتشار عمومی content.json انجام نشد: '+(pubErr.message||'خطای GitHub')+'. توکن GitHub با دسترسی Contents را در ورود پنل وارد کنید و دوباره انتشار را انجام دهید.');}
      }else{draw();msg('داده‌ها در Cloudflare ذخیره شد. برای انتشار فهرست عمومی و نمایش موارد روی نقشه، با توکن GitHub دارای دسترسی Contents وارد شوید و «انتشار تغییرات» را بزنید.');}
    }
    else if(r.status===401||r.status===403){tok='';sessionStorage.removeItem('rev_admin_token');c=null;note='رمز مدیریتی پذیرفته نشد؛ دوباره وارد شوید.';draw()}
    else msg('ذخیره انجام نشد (کد '+r.status+'): '+(j.error||'خطای نامشخص'));
  }catch(e){msg('ذخیره انجام نشد؛ اتصال Worker را بررسی کنید.');}
}
/* ---- تصویر: انتخاب، کوچک‌سازی و آپلود ---- */
const choose=()=>new Promise(r=>{const i=document.createElement('input');i.type='file';i.accept='image/*';i.onchange=()=>r(i.files[0]);i.click()});
const shrink=f=>new Promise((res,rej)=>{const im=new Image();im.onload=()=>{const s=Math.min(1,1400/im.width),cv=document.createElement('canvas');cv.width=im.width*s;cv.height=im.height*s;const x=cv.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,cv.width,cv.height);x.drawImage(im,0,0,cv.width,cv.height);res(cv.toDataURL('image/jpeg',.82))};im.onerror=rej;im.src=URL.createObjectURL(f)});
async function upImage(){
  const f=await choose(); if(!f) return null;
  if(!gitTok){msg('برای آپلود تصویر، توکن GitHub را در بخش ورود پنل وارد کنید؛ یا فعلاً نشانی تصویر را دستی وارد کنید.');return null}
  msg('در حال آپلود تصویر به مخزن GitHub...');
  try{
    const d=await shrink(f), p='images/'+Date.now().toString(36)+'.jpg';
    const r=await fetch(API+p,{method:'PUT',headers:GH(),body:JSON.stringify({message:'آپلود تصویر از پنل REV',content:d.split(',')[1]})});
    if(!r.ok){msg('آپلود تصویر نشد (کد '+r.status+'). دسترسی توکن GitHub را بررسی کنید.');return null}
    prev[p]=d;msg('تصویر در GitHub آپلود شد؛ بعد از «انتشار تغییرات» نشانی آن در دیتابیس ذخیره می‌شود.');return p;
  }catch(e){msg('این فایل به‌عنوان تصویر خوانده نشد.');return null}
}
/* ---- صفحه‌ها ---- */
function login(){
  root.innerHTML=`<div class="box"><h2>ورود به پنل مدیریت REV</h2><p style="color:var(--muted)">رمز مدیریتی Cloudflare را وارد کنید. این رمز فقط تا پایان نشست همین مرورگر نگه داشته می‌شود.</p>
  <label for="t">رمز مدیریتی Cloudflare (ADMIN_TOKEN)</label><input type="password" id="t" dir="ltr" autocomplete="current-password">
  <label for="gt">توکن GitHub برای آپلود تصویر (اختیاری)</label><input type="password" id="gt" dir="ltr" autocomplete="off" placeholder="برای آپلود تصاویر لازم است">
  <p class="hint">توکن GitHub فعلاً فقط برای آپلود تصویر استفاده می‌شود. آن را در کد سایت ننویسید و از رایانه عمومی استفاده نکنید.</p>
  <p style="margin-top:12px"><button class="btn main" data-a="login">ورود</button></p><p id="msg">${esc(note)}</p></div>`;
  if($('t')) $('t').value=tok;
  if($('gt')) $('gt').value=gitTok;
}
function list(){
  const t=TYPES[tab], items=c[tab];
  return `<p style="margin-bottom:12px"><button class="btn main" data-a="new">افزودن ${t.one} جدید</button></p>`+
   (items.length?items.map((it,i)=>`<div class="row"><div>${esc(it.title)}<small>${esc(PARTS[it.part]||'')} ${esc(it.date||it.priceDate||it.price||'')}</small></div><div><button class="btn" data-a="edit" data-i="${i}">ویرایش</button> <button class="btn red" data-a="del" data-i="${i}">حذف</button></div></div>`).join(''):'<div class="box" style="color:var(--muted)">هنوز موردی ثبت نشده است.</div>');
}
function imgField(id,v,attr){
  return `<div class="imgf"><input type="text" id="${id}" ${attr} value="${esc(v)}" dir="ltr" placeholder="تصویری انتخاب نشده" readonly>
  <button class="btn main" data-a="up" data-id="${id}">آپلود تصویر</button><button class="btn red" data-a="clr" data-id="${id}">حذف</button>
  <img id="p_${id}" src="${esc(prev[v]||v)}" alt="" ${v?'':'hidden'}></div>`;
}
function form(){
  const t=TYPES[tab], it=edit.item;
  return `<div class="box">`+t.fields.map(([k,l,ty])=>{
    const v=it[k]??'', id='f_'+k;
    let el;
    if(ty==='part') el=`<select id="${id}" data-f="${k}">${Object.entries(PARTS).map(([pk,pn])=>`<option value="${pk}" ${v===pk?'selected':''}>${pn}</option>`).join('')}</select>`;
    else if(ty==='area') el=`<textarea id="${id}" data-f="${k}" rows="3">${esc(v)}</textarea>`;
    else if(ty.startsWith('sel:')) el=`<select id="${id}" data-f="${k}">${ty.slice(4).split(',').map(o=>{const [ov,ol]=o.split('|');return `<option value="${ov}" ${v===ov?'selected':''}>${ol}</option>`}).join('')}</select>`;
    else if(ty==='stock') el=`<select id="${id}" data-f="${k}"><option value="in" ${v!=='out'?'selected':''}>موجود</option><option value="out" ${v==='out'?'selected':''}>ناموجود</option></select>`;
    else if(ty==='img') el=imgField(id,v,`data-f="${k}"`);
    else if(ty==='body') el=`<div class="tb"><button class="btn" data-a="fmt" data-w="b"><b>B</b> پررنگ</button><button class="btn" data-a="fmt" data-w="mark">مهم</button><button class="btn" data-a="fmt" data-w="h">عنوان فرعی</button><button class="btn" data-a="fmt" data-w="link">لینک</button><button class="btn" data-a="fmt" data-w="img">تصویر</button><label style="margin:0;display:flex;gap:6px;align-items:center">رنگ متن <input type="color" id="tc" value="#d93025"></label></div>
      <textarea id="${id}" data-f="${k}" rows="14">${esc((v||[]).join('\n\n'))}</textarea><p class="hint">برای جدا کردن پاراگراف‌ها یک خط خالی بگذارید. متن را انتخاب کنید و یکی از دکمه‌های بالا را بزنید.</p>`;
    else el=`<input type="text" id="${id}" data-f="${k}" value="${esc(v)}">`;
    return `<label for="${id}">${l}</label>${el}`;
  }).join('')+`<p style="margin-top:16px"><button class="btn main" data-a="ok">ثبت</button> <button class="btn" data-a="cancel">انصراف</button></p></div>`;
}
function look(){
  const t=c.theme;
  const col=(k,l)=>`<label>${l}</label><input type="color" data-t="${k}" value="${t[k]}">`;
  return `<div class="box"><h3>رنگ‌ها و فونت</h3>${col('accent','رنگ اصلی (دکمه‌ها، نقطه‌ها، خط تیترها)')}${col('dark','زمینه‌ی تیره (هدر و بالای صفحه‌ها)')}${col('paper','زمینه‌ی روشن')}${col('text','رنگ متن')}
  <label>فونت</label><select data-t="font">${Object.entries(FONTS).map(([k,n])=>`<option value="${k}" ${t.font===k?'selected':''}>${n}</option>`).join('')}</select>

function stationDate(s){
  const raw=s?.updated_at||s?.updatedAt||s?.last_updated||'';
  if(!raw)return {label:'ثبت به‌روزرسانی نشده',time:0,missing:true};
  const t=Date.parse(raw);
  if(!Number.isFinite(t))return {label:'تاریخ نامعتبر',time:0,missing:true};
  return {label:new Date(t).toLocaleString('fa-IR'),time:t,missing:false};
}
function stationIsStale(s){
  const d=stationDate(s);
  return d.missing || (Date.now()-d.time)>30*24*60*60*1000;
}
function stationDistanceKm(a,b){
  const rad=x=>x*Math.PI/180, dLat=rad(Number(b.latitude)-Number(a.latitude)), dLon=rad(Number(b.longitude)-Number(a.longitude));
  const x=Math.sin(dLat/2)**2+Math.cos(rad(Number(a.latitude)))*Math.cos(rad(Number(b.latitude)))*Math.sin(dLon/2)**2;
  return 6371*2*Math.asin(Math.min(1,Math.sqrt(x)));
}
function findStationDuplicates(s){
  if(!Array.isArray(stationsCache))return [];
  const sid=String(s.source_id||'').trim().toLowerCase(), src=String(s.source||'').trim().toLowerCase();
  return stationsCache.filter(x=>{
    if(s.id&&String(x.id)===String(s.id))return false;
    const xid=String(x.source_id||'').trim().toLowerCase(), xsrc=String(x.source||'').trim().toLowerCase();
    const sameSourceId=!!sid&&sid===xid&&(!src||!xsrc||src===xsrc);
    const validCoords=[s.latitude,s.longitude,x.latitude,x.longitude].every(v=>v!==''&&v!==null&&v!==undefined&&Number.isFinite(Number(v)));
    const closeCoords=validCoords&&Math.abs(Number(s.latitude))<=90&&Math.abs(Number(x.latitude))<=90&&Math.abs(Number(s.longitude))<=180&&Math.abs(Number(x.longitude))<=180&&stationDistanceKm(s,x)<=0.15;
    return sameSourceId||closeCoords;
  });
}

function parseCSV(text){
  const rows=[];let row=[],cell='',quoted=false;const firstLine=text.split(/\r?\n/,1)[0]||'';const delimiter=firstLine.includes(',')?',':firstLine.includes(';')?';':'\t';
  for(let i=0;i<text.length;i++){const ch=text[i];if(ch==='"'&&quoted&&text[i+1]==='"'){cell+='"';i++}else if(ch==='"'){quoted=!quoted}else if(ch===delimiter&&!quoted){row.push(cell.trim());cell=''}else if((ch==='\n'||ch==='\r')&&!quoted){if(ch==='\r'&&text[i+1]==='\n')i++;row.push(cell.trim());if(row.some(Boolean))rows.push(row);row=[];cell=''}else cell+=ch}
  row.push(cell.trim());if(row.some(Boolean))rows.push(row);if(rows.length<2)throw new Error('فایل باید یک ردیف عنوان و دست‌کم یک ردیف داده داشته باشد.');
  const keyMap={name:['name','title','station_name','نام','نام جایگاه'],address:['address','آدرس'],latitude:['latitude','lat','عرض جغرافیایی','عرض'],longitude:['longitude','lon','lng','طول جغرافیایی','طول'],connectors:['connectors','connector_types','کانکتورها','کانکتور'],power_kw:['power_kw','power','توان','توان شارژ'],status:['status','وضعیت'],source_url:['source_url','url','لینک','لینک منبع'],source_id:['source_id','شناسه منبع'],id:['id','شناسه'],source:['source','منبع']};
  const headers=rows[0].map(h=>h.trim().toLowerCase());const idx={};for(const [k,aliases] of Object.entries(keyMap)){idx[k]=headers.findIndex(h=>aliases.includes(h))}
  if(idx.name<0||idx.latitude<0||idx.longitude<0)throw new Error('ستون‌های name، latitude و longitude الزامی‌اند.');
  return rows.slice(1).map(r=>{const o={};for(const k of Object.keys(keyMap)){if(idx[k]>=0)o[k]=r[idx[k]]??''}if(o.connectors)o.connectors=o.connectors.split(/[,،;|]/).map(x=>x.trim()).filter(Boolean);if(o.power_kw==='')o.power_kw=null;if(o.latitude!=='')o.latitude=Number(o.latitude);if(o.longitude!=='')o.longitude=Number(o.longitude);if(o.power_kw!==null&&o.power_kw!==undefined)o.power_kw=Number(o.power_kw);o.source=o.source||'rev';o.status=o.status||'unknown';return o}).filter(o=>o.name||o.latitude||o.longitude);
}

});
root.addEventListener('change',async e=>{
  if(e.target.id==='station-csv'&&e.target.files?.[0]){const file=e.target.files[0];try{const text=await file.text();const rows=parseCSV(text);if(!rows.length){msg('هیچ ردیف معتبری در فایل پیدا نشد.');return}if(!confirm(`${rows.length} ردیف برای ورود آماده است. موارد هم‌مختصات/هم‌شناسه به‌روزرسانی می‌شوند. ادامه می‌دهید؟`))return;msg('در حال ورود گروهی...');const r=await fetch(WORKER+'/api/admin/stations/bulk',{method:'POST',headers:H(),body:JSON.stringify({stations:rows})});const j=await r.json().catch(()=>({}));if(!r.ok||!j.success)throw new Error(j.error||('HTTP '+r.status));stationsCache=null;note=`ورود گروهی موفق بود؛ ${j.count} ردیف پردازش شد.`;await loadStations()}catch(err){msg('ورود CSV ناموفق بود: '+(err.message||'خطای فایل'))}finally{e.target.value=''}}
});

root.addEventListener('click',async e=>{
  const b=e.target.closest('[data-a]'); if(!b) return;
  const a=b.dataset.a, i=+b.dataset.i;
  if(a==='login'){tok=$('t').value.trim();gitTok=$('gt').value.trim();if(!tok){msg('رمز مدیریتی را وارد کنید.');return}sessionStorage.setItem('rev_admin_token',tok);if(gitTok)sessionStorage.setItem('rev_github_token',gitTok);else sessionStorage.removeItem('rev_github_token');c=null;draw()}
  else if(a==='out'){sessionStorage.removeItem('rev_admin_token');sessionStorage.removeItem('rev_github_token');tok='';gitTok='';c=null;note='';draw()}
  else if(a==='tab'){tab=b.dataset.k;edit=null;stationEdit=null;note='';draw();if(tab==='stations')loadStations();if(tab==='set')loadAuthSettings()}
  else if(a==='new'){edit={i:-1,item:tab==='products'?{stock:'in'}:tab==='cars'?{}:(tab==='serviceCenters'||tab==='partsStores')?{status:'pending'}:{part:'battery'}};draw()}
  else if(a==='edit'){edit={i,item:{...c[tab][i]}};draw()}
  else if(a==='del'){if(confirm('این مورد حذف شود؟')){c[tab].splice(i,1);dirty=true;draw()}}
  else if(a==='cancel'){edit=null;draw()}
  else if(a==='reset'){c.theme={...THEME0};dirty=true;draw()}
  else if(a==='up'||a==='clr'){
    const id=b.dataset.id, inp=$(id), im=$('p_'+id);
    let p=''; if(a==='up'){p=await upImage(); if(!p)return}
    inp.value=p; im.hidden=!p; if(p)im.src=prev[p];
    if(inp.dataset.pi){c.partImages[inp.dataset.pi]=p;if(!p)delete c.partImages[inp.dataset.pi];dirty=true}
  }
  else if(a==='fmt'){
    const w=b.dataset.w;
    if(w==='b')wrap('**','**','متن پررنگ');
    else if(w==='mark')wrap('==','==','متن مهم');
    else if(w==='h')wrap('\n\n## ','\n\n','عنوان فرعی');
    else if(w==='link'){const u=prompt('آدرس لینک (با https:// شروع شود):');if(u)wrap('[','](' +u.trim()+')','متن لینک')}
    else if(w==='img'){const p=await upImage();if(p)wrap('\n\n![توضیح تصویر](' +p+')\n\n','','')}
  }
  else if(a==='ok'){
    const it=collect();
    if(!it.title){msg('عنوان لازم است.');return}
    if(tab==='serviceCenters'||tab==='partsStores'){
      const lat=Number(it.latitude),lon=Number(it.longitude);
      if(it.latitude!==''||it.longitude!=='')if(!Number.isFinite(lat)||lat < -90||lat > 90||!Number.isFinite(lon)||lon < -180||lon > 180){msg('مختصات باید معتبر باشد؛ برای نمایش روی نقشه هر دو مختصات را وارد کنید.');return}
      it.category=tab==='serviceCenters'?'authorized_ev_service':'ev_parts_store';it.latitude=it.latitude===''?'':lat;it.longitude=it.longitude===''?'':lon;it.id=it.id||tab+'-'+Date.now().toString(36);
    }
    if(tab==='articles'&&!it.slug)it.slug='a'+Date.now().toString(36);
    if(edit.i<0)c[tab].unshift(it);else c[tab][edit.i]=it;
    edit=null;dirty=true;draw();
  }
  else if(a==='station-refresh'){stationsCache=null;loadStations()}
  else if(a==='station-new'){stationEdit={isNew:true,item:{source:'rev',status:'unknown'}};draw()}
  else if(a==='station-edit'){stationEdit={isNew:false,item:{...stationsCache[i]}};draw()}
  else if(a==='station-cancel'){stationEdit=null;draw()}
  else if(a==='station-save'){
    const s=stationFormValues();
    if(!s.name){msg('نام جایگاه الزامی است.');return}
    if(!Number.isFinite(s.latitude)||s.latitude < -90||s.latitude > 90||!Number.isFinite(s.longitude)||s.longitude < -180||s.longitude > 180){msg('مختصات جغرافیایی معتبر وارد کنید.');return}
    if(s.power_kw!==null&&(!Number.isFinite(s.power_kw)||s.power_kw<0)){msg('توان شارژ باید عدد مثبت یا خالی باشد.');return}
    const duplicates=findStationDuplicates(s);
    if(duplicates.length){
      const names=duplicates.slice(0,4).map(x=>x.name||'بدون نام').join('، ');
      const more=duplicates.length>4?' و '+(duplicates.length-4)+' مورد دیگر':'';
      if(!confirm('احتمال ثبت تکراری وجود دارد. جایگاه نزدیک یا دارای شناسه منبع یکسان: '+names+more+' .\nفاصله مختصات تا ۱۵۰ متر یا شناسه منبع یکسان است. با وجود این هشدار ادامه می‌دهید؟'))return;
    }
    try{const isNew=stationEdit.isNew;const endpoint=isNew?WORKER+'/api/admin/stations':WORKER+'/api/admin/stations/'+encodeURIComponent(s.id);const r=await fetch(endpoint,{method:isNew?'POST':'PUT',headers:H(),body:JSON.stringify(s)});const j=await r.json().catch(()=>({}));if(!r.ok||!j.success)throw new Error(j.error||('HTTP '+r.status));stationEdit=null;stationsCache=null;note=j.message||'ذخیره شد.';await loadStations()}catch(e){msg('ذخیره جایگاه انجام نشد: '+(e.message||'خطای اتصال'))}
  }
  else if(a==='station-delete'){const s=stationsCache[i];if(s&&confirm('جایگاه «'+s.name+'» حذف شود؟')){try{const r=await fetch(WORKER+'/api/admin/stations/'+encodeURIComponent(s.id),{method:'DELETE',headers:H()});const j=await r.json().catch(()=>({}));if(!r.ok||!j.success)throw new Error(j.error||('HTTP '+r.status));stationsCache=null;note='جایگاه حذف شد.';await loadStations()}catch(e){msg('حذف انجام نشد: '+(e.message||'خطای اتصال'))}}}
  else if(a==='station-import')$('station-csv').click()
  else if(a==='station-template')downloadStationTemplate()
  else if(a==='auth-save')saveAuthSettings();
  else if(a==='pub')save();
});
draw();
</script>
</body>
</html>
