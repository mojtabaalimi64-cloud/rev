name: Deploy REV Auth Worker

on:
  push:
    branches: [main]
    paths:
      - 'cloudflare/rev-auth-worker.js'
      - '.github/workflows/deploy-rev-auth.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate Worker JavaScript syntax
        run: node --check cloudflare/rev-auth-worker.js

      - name: Create isolated Wrangler configuration
        env:
          D1_DATABASE_ID: ${{ secrets.REV_AUTH_D1_DATABASE_ID }}
        run: |
          test -n "$D1_DATABASE_ID" || (echo 'Missing REV_AUTH_D1_DATABASE_ID secret' && exit 1)
          cat > wrangler.toml <<EOF
          name = "rev-auth-api"
          main = "cloudflare/rev-auth-worker.js"
          compatibility_date = "2026-10-15"

          [[d1_databases]]
          binding = "DB"
          database_name = "rev-db"
          database_id = "$D1_DATABASE_ID"
          EOF

      - name: Deploy only REV Auth Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo 'Missing CLOUDFLARE_API_TOKEN secret' && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo 'Missing CLOUDFLARE_ACCOUNT_ID secret' && exit 1)
          npx --yes wrangler@4 deploy --config wrangler.toml --keep-vars

      - name: Smoke-test deployed Worker
        run: |
          set -e
          curl --fail --silent --show-error 'https://rev-auth-api.mojtaba-alimi64.workers.dev/api/health' -o /tmp/rev-auth-health.json
          node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync('/tmp/rev-auth-health.json','utf8'));if(x.success!==true||x.service!=='REV Auth'||x.database!=='connected')process.exit(1);console.log('REV Auth health and D1 connectivity OK')"
          curl --fail --silent --show-error 'https://rev-auth-api.mojtaba-alimi64.workers.dev/api/auth/status' -o /tmp/rev-auth-status.json
          node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync('/tmp/rev-auth-status.json','utf8'));if(x.success!==true||typeof x.enabled!=='boolean'||typeof x.emailConfigured!=='boolean')process.exit(1);console.log('REV Auth status endpoint OK; registration remains controlled by server configuration')"
