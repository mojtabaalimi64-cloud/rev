<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#080b0d"><title>تعیین رمز جدید | REV</title><link rel="stylesheet" href="./rev-theme.css?v=1"><style>
:root{--bg:#080b0d;--panel:#121a1f;--line:#2a343a;--muted:#aab6bc;--green:#39ff88;--text:#f5f7f8}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:18px;background:linear-gradient(145deg,#080b0d,#102126);color:var(--text);font:16px/1.9 Vazirmatn,Vazir,Tahoma,sans-serif}.card{width:min(100%,520px);padding:24px;border:1px solid var(--line);border-radius:18px;background:var(--panel)}h1{font-size:25px;margin-top:0}p{color:var(--muted)}label{display:block;margin:12px 0 4px}input{width:100%;padding:12px;border:1px solid #35464d;border-radius:10px;background:#0c1215;color:white;font:inherit}button,a{display:inline-block;margin-top:14px;border-radius:10px;padding:10px 15px;font:inherit;text-decoration:none;cursor:pointer}button{border:0;background:var(--green);color:#07100b;font-weight:800}a{border:1px solid #35464d;color:white}#status{margin-top:12px;color:var(--green);white-space:pre-wrap}
</style></head><body><main class="card"><h1>تعیین رمز عبور جدید</h1><p>برای امنیت حساب، رمز جدید باید حداقل ۱۲ نویسه داشته باشد. پیوند بازیابی فقط یک‌بار و تا ۳۰ دقیقه معتبر است.</p><form id="resetForm"><label>رمز جدید<input name="password" type="password" minlength="12" maxlength="128" autocomplete="new-password" required></label><label>تکرار رمز جدید<input name="confirm" type="password" minlength="12" maxlength="128" autocomplete="new-password" required></label><button type="submit">ذخیره رمز جدید</button></form><div id="status" role="status"></div><a href="./account.html">رفتن به ورود حساب</a></main><script>
const API='https://rev-auth-api.mojtaba-alimi64.workers.dev',token=new URLSearchParams(location.search).get('token'),form=document.getElementById('resetForm'),status=document.getElementById('status');
form.addEventListener('submit',async e=>{e.preventDefault();const f=new FormData(form),password=String(f.get('password')||'');if(!token){status.textContent='پیوند بازیابی در نشانی صفحه وجود ندارد؛ از صفحه ورود دوباره درخواست دهید.';return}if(password!==f.get('confirm')){status.textContent='رمزها یکسان نیستند.';return}try{const r=await fetch(API+'/api/auth/reset-password',{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,password})}),j=await r.json().catch(()=>({}));if(!r.ok||!j.success)throw new Error(j.error||'تغییر رمز انجام نشد.');status.textContent=j.message||'رمز تغییر کرد؛ وارد حساب شوید.';form.reset()}catch(err){status.textContent=err.message||'خطا در ارتباط با سرویس بازیابی.'}});
</script></body></html>
